<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محول الوحدات — أدواتي</title>
<meta name="description" content="حول بين وحدات الطول والوزن والحرارة والمساحة والسرعة بسهولة تامة ومجاناً.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-brand">أدواتي</a>
    <div class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="about.html">من نحن</a>
      <a href="contact.html">تواصل معنا</a>
    </div>
  </div>
</nav>

<main>
  <div class="tool-page">
    <div class="page-header">
      <a href="index.html">← العودة للرئيسية</a>
    </div>

    <div class="card">
      <div class="card-icon" style="background:#f0f9ff;">🔄</div>
      <div class="card-title">محول الوحدات</div>
      <div class="card-subtitle">حول بين وحدات الطول والوزن</div>
      <div class="divider"></div>

      <div class="tabs">
        <div class="tab active" data-type="length" onclick="switchType('length')">الطول</div>
        <div class="tab" data-type="weight" onclick="switchType('weight')">الوزن</div>
      </div>

      <label for="inputValue">القيمة</label>
      <input type="number" id="inputValue" placeholder="مثال: 10" oninput="convert()">

      <div class="row" style="margin-top:0;">
        <div>
          <label for="fromUnit">من</label>
          <select id="fromUnit" onchange="convert()"></select>
        </div>
        <div>
          <label for="toUnit">إلى</label>
          <select id="toUnit" onchange="convert()"></select>
        </div>
      </div>

      <div id="result" class="result-box success">
        <div class="result-value" id="resultValue" style="font-size:22px;"></div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="about.html">من نحن</a>
    <a href="contact.html">تواصل معنا</a>
  </div>
  <div class="footer-copy">© 2026 أدواتي</div>
</footer>

<script>
const units = {
  length: { "متر": 1, "سنتيمتر": 0.01, "كيلومتر": 1000, "ميل": 1609.34, "قدم": 0.3048, "إنش": 0.0254 },
  weight: { "كيلوغرام": 1, "غرام": 0.001, "رطل": 0.453592, "أونصة": 0.0283495 }
};

let currentType = 'length';

function populateSelects() {
  const fromSel = document.getElementById('fromUnit');
  const toSel = document.getElementById('toUnit');
  fromSel.innerHTML = '';
  toSel.innerHTML = '';
  Object.keys(units[currentType]).forEach((unit, i) => {
    fromSel.innerHTML += `<option value="${unit}" ${i===0?'selected':''}>${unit}</option>`;
    toSel.innerHTML += `<option value="${unit}" ${i===1?'selected':''}>${unit}</option>`;
  });
}

function switchType(type) {
  currentType = type;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-type="${type}"]`).classList.add('active');
  populateSelects();
  convert();
}

function convert() {
  const value = parseFloat(document.getElementById('inputValue').value);
  const from = document.getElementById('fromUnit').value;
  const to = document.getElementById('toUnit').value;
  const box = document.getElementById('result');
  if (isNaN(value)) { box.classList.remove('show'); return; }
  const converted = (value * units[currentType][from]) / units[currentType][to];
  document.getElementById('resultValue').textContent = `${value} ${from} = ${+converted.toFixed(6)} ${to}`;
  box.classList.add('show');
}

populateSelects();
</script>

</body>
</html>
