<meta name="description" content="Free unit converter for length, weight, temperature and more. محول الوحدات مجاناً — حوّل بين وحدات الطول والوزن والحرارة.">

<body>

  <div class="nav-links">
    <a href="index.html" data-i18n="nav_home">الرئيسية</a>

    <button class="signup-nav-btn" onclick="openSignup()" id="signupNavBtn" data-i18n="signup_btn">تسجيل</button>
    <div class="lang-switcher">
      <button class="lang-btn" onclick="toggleLangMenu()">🌐 <span id="currentLang">عر</span> ▾</button>
      <div class="lang-menu" id="langMenu">
        <a onclick="setLang('ar')">🇸🇦 العربية</a><a onclick="setLang('en')">🇬🇧 English</a>
        <a onclick="setLang('fr')">🇫🇷 Français</a><a onclick="setLang('es')">🇪🇸 Español</a>
        <a onclick="setLang('de')">🇩🇪 Deutsch</a><a onclick="setLang('ru')">🇷🇺 Русский</a>
      </div>
    </div>

</div></nav>
<main><div class="tool-page">
  <div class="page-header"><a href="index.html" data-i18n="back">← العودة للرئيسية</a></div>
  <div class="card">
    <div class="card-icon" style="background:#f0f9ff;">🔄</div>
    <div class="card-title" data-i18n="unit_title">محول الوحدات</div>
    <div class="card-subtitle" data-i18n="unit_sub">حول بين وحدات الطول والوزن</div>
    <div class="divider"></div>
    <div class="tabs">
      <div class="tab active" data-tab="length" onclick="switchTab('length')" data-i18n="tab_length">الطول</div>
      <div class="tab" data-tab="weight" onclick="switchTab('weight')" data-i18n="tab_weight">الوزن</div>
      <div class="tab" data-tab="temp" onclick="switchTab('temp')">°</div>
    </div>
    <div class="section active" id="section-length">
      <label data-i18n="unit_value">القيمة</label>
      <input type="number" id="len-val" placeholder="0" oninput="convertLength()">
      <div class="row">
        <div><label data-i18n="unit_from">من</label>
          <select id="len-from" onchange="convertLength()">
            <option value="m">متر (m)</option><option value="km">كيلومتر (km)</option>
            <option value="cm">سنتيمتر (cm)</option><option value="mm">ميليمتر (mm)</option>
            <option value="mi">ميل (mi)</option><option value="ft">قدم (ft)</option><option value="in">بوصة (in)</option>
          </select></div>
        <div><label data-i18n="unit_to">إلى</label>
          <select id="len-to" onchange="convertLength()">
            <option value="m">متر (m)</option><option value="km">كيلومتر (km)</option>
            <option value="cm" selected>سنتيمتر (cm)</option><option value="mm">ميليمتر (mm)</option>
            <option value="mi">ميل (mi)</option><option value="ft">قدم (ft)</option><option value="in">بوصة (in)</option>
          </select></div>
      </div>
      <div id="len-result" class="result-box success"><div class="result-value" id="len-out"></div></div>
    </div>
    <div class="section" id="section-weight">
      <label data-i18n="unit_value">القيمة</label>
      <input type="number" id="wgt-val" placeholder="0" oninput="convertWeight()">
      <div class="row">
        <div><label data-i18n="unit_from">من</label>
          <select id="wgt-from" onchange="convertWeight()">
            <option value="kg">كيلوغرام (kg)</option><option value="g">غرام (g)</option>
            <option value="lb">رطل (lb)</option><option value="oz">أونصة (oz)</option><option value="t">طن (t)</option>
          </select></div>
        <div><label data-i18n="unit_to">إلى</label>
          <select id="wgt-to" onchange="convertWeight()">
            <option value="kg">كيلوغرام (kg)</option><option value="g" selected>غرام (g)</option>
            <option value="lb">رطل (lb)</option><option value="oz">أونصة (oz)</option><option value="t">طن (t)</option>
          </select></div>
      </div>
      <div id="wgt-result" class="result-box success"><div class="result-value" id="wgt-out"></div></div>
    </div>
    <div class="section" id="section-temp">
      <label data-i18n="unit_value">القيمة</label>
      <input type="number" id="tmp-val" placeholder="0" oninput="convertTemp()">
      <div class="row">
        <div><label data-i18n="unit_from">من</label>
          <select id="tmp-from" onchange="convertTemp()">
            <option value="c">مئوية (°C)</option><option value="f">فهرنهايت (°F)</option><option value="k">كلفن (K)</option>
          </select></div>
        <div><label data-i18n="unit_to">إلى</label>
          <select id="tmp-to" onchange="convertTemp()">
            <option value="c">مئوية (°C)</option><option value="f" selected>فهرنهايت (°F)</option><option value="k">كلفن (K)</option>
          </select></div>
      </div>
      <div id="tmp-result" class="result-box success"><div class="result-value" id="tmp-out"></div></div>
    </div>
  </div>
</div></main>

<script>
var UNI_T={
  ar:{len:{m:'متر (m)',km:'كيلومتر (km)',cm:'سنتيمتر (cm)',mm:'ميليمتر (mm)',mi:'ميل (mi)',ft:'قدم (ft)',in:'بوصة (in)'},wgt:{kg:'كيلوغرام (kg)',g:'غرام (g)',lb:'رطل (lb)',oz:'أونصة (oz)',t:'طن (t)'},tmp:{c:'مئوية (°C)',f:'فهرنهايت (°F)',k:'كلفن (K)'}},
  en:{len:{m:'Meter (m)',km:'Kilometer (km)',cm:'Centimeter (cm)',mm:'Millimeter (mm)',mi:'Mile (mi)',ft:'Foot (ft)',in:'Inch (in)'},wgt:{kg:'Kilogram (kg)',g:'Gram (g)',lb:'Pound (lb)',oz:'Ounce (oz)',t:'Tonne (t)'},tmp:{c:'Celsius (°C)',f:'Fahrenheit (°F)',k:'Kelvin (K)'}},
  fr:{len:{m:'Mètre (m)',km:'Kilomètre (km)',cm:'Centimètre (cm)',mm:'Millimètre (mm)',mi:'Mile (mi)',ft:'Pied (ft)',in:'Pouce (in)'},wgt:{kg:'Kilogramme (kg)',g:'Gramme (g)',lb:'Livre (lb)',oz:'Once (oz)',t:'Tonne (t)'},tmp:{c:'Celsius (°C)',f:'Fahrenheit (°F)',k:'Kelvin (K)'}},
  es:{len:{m:'Metro (m)',km:'Kilómetro (km)',cm:'Centímetro (cm)',mm:'Milímetro (mm)',mi:'Milla (mi)',ft:'Pie (ft)',in:'Pulgada (in)'},wgt:{kg:'Kilogramo (kg)',g:'Gramo (g)',lb:'Libra (lb)',oz:'Onza (oz)',t:'Tonelada (t)'},tmp:{c:'Celsius (°C)',f:'Fahrenheit (°F)',k:'Kelvin (K)'}},
  de:{len:{m:'Meter (m)',km:'Kilometer (km)',cm:'Zentimeter (cm)',mm:'Millimeter (mm)',mi:'Meile (mi)',ft:'Fuß (ft)',in:'Zoll (in)'},wgt:{kg:'Kilogramm (kg)',g:'Gramm (g)',lb:'Pfund (lb)',oz:'Unze (oz)',t:'Tonne (t)'},tmp:{c:'Celsius (°C)',f:'Fahrenheit (°F)',k:'Kelvin (K)'}},
  ru:{len:{m:'Метр (m)',km:'Километр (km)',cm:'Сантиметр (cm)',mm:'Миллиметр (mm)',mi:'Миля (mi)',ft:'Фут (ft)',in:'Дюйм (in)'},wgt:{kg:'Килограмм (kg)',g:'Грамм (g)',lb:'Фунт (lb)',oz:'Унция (oz)',t:'Тонна (t)'},tmp:{c:'Цельсий (°C)',f:'Фаренгейт (°F)',k:'Кельвин (K)'}}
};
function updateUnitOptions(){
  var t=UNI_T[localStorage.getItem('lang')||'ar'];
  ['len-from','len-to'].forEach(function(id){Array.from(document.getElementById(id).options).forEach(function(o){if(t.len[o.value])o.text=t.len[o.value];});});
  ['wgt-from','wgt-to'].forEach(function(id){Array.from(document.getElementById(id).options).forEach(function(o){if(t.wgt[o.value])o.text=t.wgt[o.value];});});
  ['tmp-from','tmp-to'].forEach(function(id){Array.from(document.getElementById(id).options).forEach(function(o){if(t.tmp[o.value])o.text=t.tmp[o.value];});});
  var lang=localStorage.getItem('lang')||'ar';
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
}
window.setLang=function(lang){localStorage.setItem('lang',lang);updateUnitOptions();if(typeof initI18n==='function')initI18n(lang);};
document.addEventListener('DOMContentLoaded',updateUnitOptions);

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelector('.tab[data-tab="'+tab+'"]').classList.add('active');
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
  document.getElementById('section-'+tab).classList.add('active');
}
var LEN={m:1,km:1000,cm:0.01,mm:0.001,mi:1609.344,ft:0.3048,in:0.0254};
var WGT={kg:1,g:0.001,lb:0.453592,oz:0.0283495,t:1000};
function convertLength(){var v=parseFloat(document.getElementById('len-val').value),f=document.getElementById('len-from').value,t=document.getElementById('len-to').value,box=document.getElementById('len-result');if(isNaN(v)){box.classList.remove('show');return;}document.getElementById('len-out').textContent=+(v*LEN[f]/LEN[t]).toFixed(4);box.classList.add('show');}
function convertWeight(){var v=parseFloat(document.getElementById('wgt-val').value),f=document.getElementById('wgt-from').value,t=document.getElementById('wgt-to').value,box=document.getElementById('wgt-result');if(isNaN(v)){box.classList.remove('show');return;}document.getElementById('wgt-out').textContent=+(v*WGT[f]/WGT[t]).toFixed(4);box.classList.add('show');}
function convertTemp(){var v=parseFloat(document.getElementById('tmp-val').value),f=document.getElementById('tmp-from').value,t=document.getElementById('tmp-to').value,box=document.getElementById('tmp-result');if(isNaN(v)){box.classList.remove('show');return;}var c=f==='c'?v:f==='f'?(v-32)*5/9:v-273.15;var out=t==='c'?c:t==='f'?c*9/5+32:c+273.15;document.getElementById('tmp-out').textContent=+out.toFixed(4);box.classList.add('show');}
</script>
<script src="i18n.js?v=27"></script>
</body></html>
