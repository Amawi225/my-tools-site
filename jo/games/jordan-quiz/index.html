<script>
const QUESTIONS = [
  {q:'شو عاصمة الأردن؟', opts:['إربد','عمّان','الزرقاء','العقبة'], correct:1},
  {q:'أي بحر بيعتبر أخفض نقطة على سطح الأرض وموجود بالأردن؟', opts:['البحر الأحمر','البحر الأبيض المتوسط','البحر الميت','بحر قزوين'], correct:2},
  {q:'مدينة البتراء الأثرية نحتها شعب...', opts:['الفراعنة','الأنباط','الآشوريون','الفينيقيون'], correct:1},
  {q:'شو اسم العملة الرسمية بالأردن؟', opts:['الريال','الدرهم','الدينار','الجنيه'], correct:2},
  {q:'شو الأكلة الوطنية الأردنية الأشهر؟', opts:['الكبسة','المنسف','الملوخية','المقلوبة'], correct:1},
  {q:'الأردن بيطل على أي بحر من جهة مدينة العقبة؟', opts:['البحر الأحمر','البحر الأسود','بحر العرب','الخليج العربي'], correct:0},
  {q:'شو اسم النهر اللي بيشكل جزء من حدود الأردن الغربية؟', opts:['نهر النيل','نهر الفرات','نهر الأردن','نهر دجلة'], correct:2},
  {q:'كم عدد محافظات الأردن؟', opts:['8','10','12','14'], correct:2},
  {q:'أي مدينة أردنية تشتهر بالمدرج الروماني القديم؟', opts:['جرش','الكرك','مادبا','السلط'], correct:0},
  {q:'أي جبل بالأردن يُعتقد أن النبي موسى عليه السلام رأى منه أرض فلسطين؟', opts:['جبل نيبو','جبل عجلون','جبل القلعة','جبل اللويبدة'], correct:0},
  {q:'الأردن بيشترك بحدود مع كم دولة؟', opts:['3','4','5','6'], correct:2},
  {q:'شو اسم أشهر محمية طبيعية صحراوية بالأردن اشتهرت بأفلام السينما العالمية؟', opts:['وادي رم','ديانا','ضانا','الأزرق'], correct:0}
];

let currentQ = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  const q = QUESTIONS[currentQ];
  document.getElementById('progressLabel').textContent = 'سؤال ' + (currentQ + 1) + ' من ' + QUESTIONS.length;
  document.getElementById('questionText').textContent = q.q;
  const optionsArea = document.getElementById('optionsArea');
  optionsArea.innerHTML = '';
  q.opts.forEach(function(opt, i) {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.style.cssText = 'padding:12px;border:2px solid var(--border);border-radius:8px;background:var(--surface);font-size:15px;cursor:pointer;text-align:right;';
    btn.onclick = function() { selectAnswer(i, btn); };
    optionsArea.appendChild(btn);
  });
}

function selectAnswer(i, btn) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[currentQ];
  const allButtons = document.querySelectorAll('#optionsArea button');
  allButtons.forEach(function(b, idx) {
    b.disabled = true;
    if (idx === q.correct) { b.style.background = '#dcfce7'; b.style.borderColor = '#16a34a'; }
    else if (idx === i) { b.style.background = '#fee2e2'; b.style.borderColor = '#dc2626'; }
  });
  if (i === q.correct) score++;
  setTimeout(function() {
    currentQ++;
    if (currentQ < QUESTIONS.length) loadQuestion();
    else showResult();
  }, 900);
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  const pct = Math.round((score / QUESTIONS.length) * 100);
  let emoji, msg;
  if (pct >= 90) { emoji = '🏆'; msg = 'أردني أصيل! نتيجة رهيبة.'; }
  else if (pct >= 70) { emoji = '🇯🇴'; msg = 'معلوماتك عن الأردن ممتازة!'; }
  else if (pct >= 50) { emoji = '👍'; msg = 'مش بطال، بس فيه مجال تتحسن.'; }
  else { emoji = '📚'; msg = 'وقتها نراجع شوي عن الأردن!'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultScore').textContent = score + ' من ' + QUESTIONS.length + ' (' + pct + '%)';
  document.getElementById('resultMessage').textContent = msg;
}

function restart() {
  currentQ = 0;
  score = 0;
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  loadQuestion();
}

loadQuestion();
</script>
