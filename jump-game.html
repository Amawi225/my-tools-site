.lb-empty{font-size:13px;color:var(--text-muted);text-align:center;padding:10px 0;}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:6px;background:var(--surface-2);border:1px solid var(--border);}

.lb-medal{font-size:20px;flex-shrink:0;} .lb-name{font-weight:700;font-size:14px;flex:1;} .lb-score{font-size:12px;font-weight:600;color:var(--primary);}

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 380, H = 320;
const GRAVITY = 0.55, JUMP_V = -12.5;
const STORAGE_KEY = 'adawati_jump_lb';
const MEDALS=['🥇','🥈','🥉'], MEDAL_CLS=['gold','silver','bronze'];
let currentLang = 'ar';
let state = 'idle', rafId = null;
let score = 0, stars = 0, camX = 0, speed = 3, spawnX = W+100;
let pendingScore = null;

const PLATFORM_COLORS = ['#22c55e','#3b82f6','#f59e0b','#8b5cf6','#ef4444'];
const PLATFORM_H = 14;
const GROUND_Y = H - 40;

const player = {x:80, y:GROUND_Y-52, vy:0, w:34, h:42, jumpsLeft:2, onGround:false};
let platforms = [], starObjs = [], particles = [];

function resetGame(){
  score=0; stars=0; camX=0; speed=3; spawnX=W+80;
  player.x=80; player.y=GROUND_Y-52; player.vy=0; player.jumpsLeft=2; player.onGround=false;
  platforms=[
    {x:0, y:GROUND_Y, w:W+200, h:PLATFORM_H, color:'#166534'},
    {x:400, y:GROUND_Y-80, w:120, h:PLATFORM_H, color:'#22c55e'},
    {x:580, y:GROUND_Y-40, w:100, h:PLATFORM_H, color:'#3b82f6'},
  ];
  starObjs=[]; particles=[];
}

function spawnPlatforms(){
  while(spawnX < camX + W + 400){
    const gap = 60 + Math.random()*(30 + Math.min(score/50, 60));
    const pw  = Math.max(60, 140 - Math.min(score/40, 80));
    const py  = GROUND_Y - 40 - Math.random()*100;
    const clr = PLATFORM_COLORS[Math.floor(Math.random()*PLATFORM_COLORS.length)];
    platforms.push({x:spawnX, y:py, w:pw, h:PLATFORM_H, color:clr});
    // Maybe add a star
    if(Math.random()<0.5) starObjs.push({x:spawnX+pw/2, y:py-28, collected:false});
    spawnX += gap + pw;
  }
}

function jump(){
  if(player.jumpsLeft>0){
    player.vy = JUMP_V * (player.jumpsLeft===2?1:0.85);
    player.jumpsLeft--;
    player.onGround=false;
    // particle burst
    for(let i=0;i<8;i++) particles.push({x:player.x+player.w/2, y:player.y+player.h, vx:(Math.random()-0.5)*4, vy:-Math.random()*3-1, life:18, color:'#fbbf24'});
  }
}

function update(){
  speed = 3 + Math.min(score/200, 5);
  camX += speed;
  spawnPlatforms();

  // Gravity
  player.vy += GRAVITY;
  player.y += player.vy;
  player.onGround = false;

  // Platform collision
  platforms.forEach(p=>{
    const px = p.x - camX;
    if(player.vy>=0 &&
       player.x+player.w-4 > px &&
       player.x+4 < px+p.w &&
       player.y+player.h >= p.y &&
       player.y+player.h <= p.y+player.h+player.vy+2){
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = 2;
    }
  });

  // Fall death
  if(player.y > H+60){ onGameOver(); return; }

  // Stars
  starObjs.forEach(s=>{
    if(!s.collected && Math.abs((s.x-camX)-player.x-player.w/2)<30 && Math.abs(s.y-player.y-player.h/2)<30){
      s.collected=true; stars++;
      for(let i=0;i<10;i++) particles.push({x:s.x-camX, y:s.y, vx:(Math.random()-0.5)*5, vy:-Math.random()*4-1, life:22, color:'#fbbf24'});
    }
  });

  // Particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;});
  particles=particles.filter(p=>p.life>0);

  // Cleanup
  const cullX = camX - 200;
  platforms=platforms.filter(p=>p.x+p.w>cullX);
  starObjs=starObjs.filter(s=>s.x>cullX);

  score = Math.floor(camX/10);
}

function drawSky(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#bfdbfe');grad.addColorStop(1,'#e0f2fe');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // Clouds
  [[60,40,3],[180,25,2],[300,55,2.5]].forEach(([cx,cy,sc])=>{
    const ox=(camX*0.12)%W;
    const x=((cx-ox%W)+W)%W;
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath();ctx.arc(x,cy,18*sc,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+22*sc,cy+5,14*sc,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x-18*sc,cy+5,12*sc,0,Math.PI*2);ctx.fill();
  });
}

function draw(){
  drawSky();
  // Ground fill
  ctx.fillStyle='#166534';ctx.fillRect(0,GROUND_Y+PLATFORM_H,W,H-GROUND_Y-PLATFORM_H);

  // Platforms
  platforms.forEach(p=>{
    const px=p.x-camX;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.roundRect(px,p.y,p.w,p.h,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.fillRect(px+4,p.y+2,p.w-8,4);
  });

  // Stars
  starObjs.filter(s=>!s.collected).forEach(s=>{
    ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⭐',s.x-camX,s.y+Math.sin(Date.now()/400)*3);
  });

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/22;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Player (superhero)
  ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('🦸',player.x+player.w/2,player.y+player.h);

  // HUD
  document.getElementById('scoreDisplay').textContent=score;
  document.getElementById('starsDisplay').textContent=stars;
  document.getElementById('bestDisplay').textContent=getBest();
}

function drawOverlay(title,sub,btn){
  ctx.fillStyle='rgba(0,0,0,.68)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 24px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(title,W/2,H/2-60);
  ctx.font='16px system-ui,sans-serif';ctx.fillStyle='#bbf7d0';
  ctx.fillText(sub,W/2,H/2-25);
  ctx.fillStyle='#22c55e';ctx.beginPath();ctx.roundRect(W/2-70,H/2+10,140,42,8);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 15px system-ui,sans-serif';
  ctx.fillText(btn,W/2,H/2+31);
}

function gameLoop(){
  if(state!=='playing')return;
  update();draw();
  rafId=requestAnimationFrame(gameLoop);
}

function startGame(){
  state='playing';resetGame();
  cancelAnimationFrame(rafId);
  document.getElementById('nameEntry').style.display='none';
  canvas.onclick=null;
  rafId=requestAnimationFrame(gameLoop);
}

function onGameOver(){
  state='over';
  cancelAnimationFrame(rafId);
  const best=getBest();
  const sc=score+stars*5;
  if(sc>best) localStorage.setItem('adawati_jump_best',sc);
  draw();
  const t=currentLang==='en'?'Game Over!':'انتهت اللعبة!';
  const sub=`${currentLang==='en'?'Score':'نقاط'}: ${score}  ⭐${stars}`;
  const btn=currentLang==='en'?'▶ Again':'▶ مجدداً';
  setTimeout(()=>{drawOverlay(t,sub,btn);canvas.onclick=()=>{canvas.onclick=null;startGame();};},200);
  if(qualifies(sc)){pendingScore=sc;document.getElementById('nameEntry').style.display='';setTimeout(()=>document.getElementById('nameInput').focus(),100);}
  if(typeof showHomePrompt==='function')showHomePrompt();
}

function getBest(){return parseInt(localStorage.getItem('adawati_jump_best')||'0');}
function getLb(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return[];}}
function saveLb(lb){localStorage.setItem(STORAGE_KEY,JSON.stringify(lb));}
function qualifies(sc){const lb=getLb();return lb.length<3||sc>lb[lb.length-1].score;}
function addEntry(n,sc){const lb=getLb();lb.push({name:n||'?',score:sc});lb.sort((a,b)=>b.score-a.score);lb.splice(3);saveLb(lb);}
function clearLb(){localStorage.removeItem(STORAGE_KEY);renderLb();}
function saveScore(){if(!pendingScore)return;addEntry(document.getElementById('nameInput').value.trim(),pendingScore);pendingScore=null;document.getElementById('nameEntry').style.display='none';document.getElementById('nameInput').value='';renderLb();}
function renderLb(){
  const lb=getLb();
  document.getElementById('lbTitle').textContent=currentLang==='en'?'🏆 Top 3 Jumpers':'🏆 أفضل 3 لاعبين';
  document.getElementById('clearBtn').textContent=currentLang==='en'?'🗑 Clear':'🗑 مسح';
  const rows=document.getElementById('lbRows');
  if(!lb.length){rows.innerHTML=`<div class="lb-empty">${currentLang==='en'?'No scores yet!':'لا توجد نتائج بعد!'}</div>`;return;}
  rows.innerHTML=lb.map((e,i)=>`<div class="lb-row ${MEDAL_CLS[i]||''}"><span class="lb-medal">${MEDALS[i]||''}</span><span class="lb-name">${e.name}</span><span class="lb-score">${e.score} pts</span></div>`).join('');
}

// Controls
document.getElementById('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='idle'||state==='over')startGame();else jump();});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(state==='idle'||state==='over')startGame();else jump();},{passive:false});
canvas.addEventListener('click',()=>{if(state==='idle')startGame();});
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){
    e.preventDefault();
    if(state==='idle'||state==='over')startGame();else jump();
  }
});

document.addEventListener('DOMContentLoaded',()=>{
  const origSet=window.setLang;
  window.setLang=function(lang){origSet&&origSet(lang);currentLang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';renderLb();};
  renderLb();
  drawSky();
  ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('🦸',player.x+player.w/2,player.y+player.h);
  drawOverlay(
    currentLang==='en'?'Jump Game!':'لعبة القفز!',
    currentLang==='en'?'Press SPACE or tap to start':'اضغط قفز أو مسّ الشاشة للبدء',
    currentLang==='en'?'▶ Start':'▶ ابدأ'
  );
});
</script>
