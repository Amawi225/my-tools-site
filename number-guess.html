<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-97DQT5FHPF"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-97DQT5FHPF');</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3337905412116301" crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة تخمين الرقم — أدواتي</title>
<meta name="description" content="العب لعبة تخمين الرقم السري. خمّن الرقم المخفي في أقل عدد من المحاولات!">
<meta name="robots" content="index, follow">
<link rel="stylesheet" href="style.css">
<style>
.guess-box{text-align:center;padding:20px 0 8px;}
.guess-number-display{font-size:72px;font-weight:900;color:var(--primary);letter-spacing:-3px;line-height:1;min-height:80px;display:flex;align-items:center;justify-content:center;}
.guess-input-row{display:flex;gap:10px;margin:16px 0;align-items:center;justify-content:center;}
.guess-input-row input{width:120px;text-align:center;font-size:24px;font-weight:700;padding:10px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);}
.guess-input-row input:focus{outline:none;border-color:var(--primary);}
.guess-hint{font-size:20px;font-weight:700;min-height:30px;transition:color 0.2s;padding:8px 0;}
.guess-hint.high{color:#ef4444;}
.guess-hint.low{color:#f59e0b;}
.guess-hint.win{color:#22c55e;}
.guess-history{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:30px;margin-top:8px;}
.guess-history span{padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;}
.guess-history span.high{background:#fee2e2;color:#ef4444;}
.guess-history span.low{background:#fef3c7;color:#d97706;}
.guess-history span.win{background:#dcfce7;color:#16a34a;}
.tries-badge{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:4px 14px;margin-bottom:4px;}
.range-row{display:flex;gap:16px;align-items:center;justify-content:center;margin:8px 0 16px;flex-wrap:wrap;}
.range-row label{font-size:13px;color:var(--text-muted);}
.range-row input{width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-size:14px;}

/* Leaderboard */
.lb-wrap{margin-top:20px;border-top:1px solid var(--border);padding-top:16px;}
.lb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.lb-title{font-size:15px;font-weight:800;color:var(--text);}
.lb-clear{font-size:12px;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:2px 6px;font-family:inherit;}
.lb-clear:hover{color:#ef4444;}
.lb-empty{font-size:13px;color:var(--text-muted);text-align:center;padding:12px 0;}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:6px;background:var(--surface-2);border:1px solid var(--border);}
.lb-row.gold{background:linear-gradient(135deg,#fef9c3,#fef08a);border-color:#eab308;}
.lb-row.silver{background:linear-gradient(135deg,#f1f5f9,#e2e8f0);border-color:#94a3b8;}
.lb-row.bronze{background:linear-gradient(135deg,#fff7ed,#fed7aa);border-color:#f97316;}
.lb-medal{font-size:20px;flex-shrink:0;}
.lb-name{font-weight:700;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-score{font-size:13px;font-weight:600;color:var(--primary);flex-shrink:0;}

/* Name entry */
.name-entry{margin-top:14px;padding:14px;background:linear-gradient(135deg,#fdf4ff,#ede9fe);border:2px solid var(--primary);border-radius:var(--radius-sm);text-align:center;}
.name-entry-msg{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--primary);}
.name-entry-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.name-entry-row input{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;width:160px;}
.name-entry-row input:focus{outline:none;border-color:var(--primary);}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-container">
  <a href="index.html" class="nav-brand">أدواتي</a>
  <div class="nav-links">
    <a href="index.html" data-i18n="nav_home">الرئيسية</a>
    <a href="about.html" data-i18n="nav_about">من نحن</a>
    <a href="contact.html" data-i18n="nav_contact">تواصل معنا</a>
    <button class="signup-nav-btn" onclick="openSignup()" id="signupNavBtn" data-i18n="signup_btn">تسجيل</button>
    <div class="lang-switcher">
      <button class="lang-btn" onclick="toggleLangMenu()">🌐 <span id="currentLang">عر</span> ▾</button>
      <div class="lang-menu" id="langMenu">
        <a onclick="setLang('ar')">🇸🇦 العربية</a><a onclick="setLang('en')">🇬🇧 English</a>
        <a onclick="setLang('fr')">🇫🇷 Français</a><a onclick="setLang('es')">🇪🇸 Español</a>
        <a onclick="setLang('de')">🇩🇪 Deutsch</a><a onclick="setLang('ru')">🇷🇺 Русский</a>
      </div>
    </div>
  </div>
</div></nav>

<main><div class="tool-page">
  <div class="page-header"><a href="index.html" data-i18n="back">← العودة للرئيسية</a></div>
  <div class="card">
    <div class="card-icon" style="background:#fdf4ff;">🎯</div>
    <div class="card-title" data-i18n="guess_card_title">لعبة تخمين الرقم</div>
    <div class="card-subtitle" data-i18n="guess_card_desc">خمّن الرقم السري في أقل عدد من المحاولات</div>
    <div class="divider"></div>

    <div class="range-row">
      <label id="rangeLbl">من 1 إلى:</label>
      <input type="number" id="maxRange" value="100" min="10" max="1000" onchange="newGame()">
      <button class="btn btn-secondary" onclick="newGame()" id="newGameBtn" style="padding:6px 16px;font-size:14px;">🔄 جديدة</button>
    </div>

    <div class="guess-box">
      <div class="tries-badge">
        <span id="triesLbl">المحاولات:</span>
        <span id="triesCount" style="color:var(--primary);">0</span>
      </div>
      <div class="guess-number-display" id="secretDisplay">?</div>
      <div class="guess-hint" id="hintMsg"></div>
      <div class="guess-input-row" id="inputRow">
        <input type="number" id="guessInput" placeholder="؟" min="1" max="100"
          onkeydown="if(event.key==='Enter')makeGuess()">
        <button class="btn btn-primary" onclick="makeGuess()" id="guessBtn">تخمين</button>
      </div>
      <div class="guess-history" id="guessHistory"></div>
    </div>

    <!-- Name entry (shown when qualifying for top 3) -->
    <div class="name-entry" id="nameEntry" style="display:none;">
      <div class="name-entry-msg" id="nameEntryMsg">🏆 دخلت إلى أفضل 3! اكتب اسمك:</div>
      <div class="name-entry-row">
        <input type="text" id="nameInput" maxlength="20" placeholder="اسمك"
          onkeydown="if(event.key==='Enter')saveScore()">
        <button class="btn btn-primary" onclick="saveScore()" id="saveBtn">💾 حفظ</button>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="lb-wrap">
      <div class="lb-header">
        <span class="lb-title" id="lbTitle">🏆 أفضل 3 لاعبين</span>
        <button class="lb-clear" onclick="clearLb()" id="clearBtn">🗑 مسح</button>
      </div>
      <div id="lbRows"></div>
    </div>
  </div>
</div></main>

<footer class="footer" style="padding:28px;">
  <div style="max-width:1160px;margin:0 auto;">
    <div class="footer-links"><a href="about.html" data-i18n="footer_about">من نحن</a><a href="contact.html" data-i18n="footer_contact">تواصل معنا</a></div>
    <div class="footer-copy-simple" data-i18n="footer_copy">© 2026 أدواتي</div>
  </div>
</footer>

<script>
const GT = {
  ar:{range:'من 1 إلى:',new:'🔄 جديدة',tries:'المحاولات:',guess:'تخمين',
      high:'كبير! جرّب رقماً أصغر ⬇️',low:'صغير! جرّب رقماً أكبر ⬆️',
      win:'أحسنت! الرقم هو {n} — خمّنته في {t} محاولة 🎉',ph:'؟',
      lbTitle:'🏆 أفضل 3 لاعبين',lbEmpty:'لا توجد نتائج بعد — كن أول المتنافسين!',
      lbNew:'🏆 دخلت إلى أفضل 3! اكتب اسمك:',lbSave:'💾 حفظ',lbPh:'اسمك',
      lbScore:'{s} محاولة',lbClear:'🗑 مسح'},
  en:{range:'From 1 to:',new:'🔄 New Game',tries:'Attempts:',guess:'Guess',
      high:'Too high! Try lower ⬇️',low:'Too low! Try higher ⬆️',
      win:'Correct! The number was {n} — you got it in {t} tries 🎉',ph:'?',
      lbTitle:'🏆 Top 3 Players',lbEmpty:'No scores yet — be the first!',
      lbNew:'🏆 You made the Top 3! Enter your name:',lbSave:'💾 Save',lbPh:'Your name',
      lbScore:'{s} tries',lbClear:'🗑 Clear'},
  fr:{range:'De 1 à:',new:'🔄 Nouveau',tries:'Essais:',guess:'Deviner',
      high:'Trop grand! Essayez moins ⬇️',low:'Trop petit! Essayez plus ⬆️',
      win:'Bravo! Le nombre était {n} — trouvé en {t} essais 🎉',ph:'?',
      lbTitle:'🏆 Top 3 Joueurs',lbEmpty:'Pas encore de scores — soyez le premier!',
      lbNew:'🏆 Vous êtes dans le Top 3! Entrez votre nom:',lbSave:'💾 Sauver',lbPh:'Votre nom',
      lbScore:'{s} essais',lbClear:'🗑 Effacer'},
  es:{range:'De 1 a:',new:'🔄 Nuevo',tries:'Intentos:',guess:'Adivinar',
      high:'¡Muy alto! Intenta menor ⬇️',low:'¡Muy bajo! Intenta mayor ⬆️',
      win:'¡Correcto! El número era {n} — lo conseguiste en {t} intentos 🎉',ph:'?',
      lbTitle:'🏆 Top 3 Jugadores',lbEmpty:'Sin puntuaciones aún — ¡sé el primero!',
      lbNew:'🏆 ¡Estás en el Top 3! Escribe tu nombre:',lbSave:'💾 Guardar',lbPh:'Tu nombre',
      lbScore:'{s} intentos',lbClear:'🗑 Borrar'},
  de:{range:'Von 1 bis:',new:'🔄 Neu',tries:'Versuche:',guess:'Raten',
      high:'Zu hoch! Kleiner versuchen ⬇️',low:'Zu niedrig! Größer versuchen ⬆️',
      win:'Richtig! Die Zahl war {n} — in {t} Versuchen 🎉',ph:'?',
      lbTitle:'🏆 Top 3 Spieler',lbEmpty:'Noch keine Einträge — sei der Erste!',
      lbNew:'🏆 Du bist in den Top 3! Gib deinen Namen ein:',lbSave:'💾 Speichern',lbPh:'Dein Name',
      lbScore:'{s} Versuche',lbClear:'🗑 Löschen'},
  ru:{range:'От 1 до:',new:'🔄 Новая',tries:'Попытки:',guess:'Угадать',
      high:'Слишком большое! Попробуйте меньше ⬇️',low:'Слишком маленькое! Попробуйте больше ⬆️',
      win:'Правильно! Число было {n} — угадано за {t} попыток 🎉',ph:'?',
      lbTitle:'🏆 Топ 3 игрока',lbEmpty:'Нет результатов — будьте первым!',
      lbNew:'🏆 Вы в Топ 3! Введите ваше имя:',lbSave:'💾 Сохранить',lbPh:'Ваше имя',
      lbScore:'{s} попыток',lbClear:'🗑 Очистить'}
};

const STORAGE_KEY = 'adawati_guess_lb';
const MEDALS = ['🥇','🥈','🥉'];
const MEDAL_CLS = ['gold','silver','bronze'];
let secret, tries, gameOver, currentLang='ar', pendingScore=null;

function tr(k){ return (GT[currentLang]||GT.ar)[k]||k; }

/* ── Leaderboard ── */
function getLb(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; }catch{ return []; } }
function saveLb(lb){ localStorage.setItem(STORAGE_KEY, JSON.stringify(lb)); }

function qualifies(score){
  const lb = getLb();
  return lb.length < 3 || score < lb[lb.length-1].score;
}

function addEntry(name, score){
  const lb = getLb();
  lb.push({name: name.trim()||'?', score});
  lb.sort((a,b)=>a.score-b.score);
  lb.splice(3);
  saveLb(lb);
}

function renderLb(){
  const lb = getLb();
  const t = GT[currentLang]||GT.ar;
  const rows = document.getElementById('lbRows');
  if(!lb.length){
    rows.innerHTML=`<div class="lb-empty">${t.lbEmpty}</div>`;
    return;
  }
  rows.innerHTML = lb.map((e,i)=>`
    <div class="lb-row ${MEDAL_CLS[i]||''}">
      <span class="lb-medal">${MEDALS[i]||''}</span>
      <span class="lb-name">${escHtml(e.name)}</span>
      <span class="lb-score">${t.lbScore.replace('{s}',e.score)}</span>
    </div>`).join('');
}

function clearLb(){
  localStorage.removeItem(STORAGE_KEY);
  renderLb();
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Game ── */
function newGame(){
  const max = parseInt(document.getElementById('maxRange').value)||100;
  secret = Math.floor(Math.random()*(max-1))+1;
  tries = 0; gameOver = false; pendingScore = null;
  document.getElementById('triesCount').textContent = '0';
  document.getElementById('secretDisplay').textContent = '?';
  document.getElementById('secretDisplay').style.color = 'var(--primary)';
  document.getElementById('hintMsg').textContent = '';
  document.getElementById('hintMsg').className = 'guess-hint';
  document.getElementById('guessHistory').innerHTML = '';
  document.getElementById('guessInput').value = '';
  document.getElementById('guessInput').max = max;
  document.getElementById('inputRow').style.display = '';
  document.getElementById('nameEntry').style.display = 'none';
  updateGameText();
}

function makeGuess(){
  if(gameOver) return;
  const inp = document.getElementById('guessInput');
  const g = parseInt(inp.value);
  if(isNaN(g)||g<1) return;
  tries++;
  document.getElementById('triesCount').textContent = tries;
  const hist = document.getElementById('guessHistory');
  const t = GT[currentLang]||GT.ar;
  const span = document.createElement('span');
  span.textContent = g;
  if(g === secret){
    span.className = 'win';
    hist.prepend(span);
    document.getElementById('secretDisplay').textContent = secret;
    document.getElementById('secretDisplay').style.color = '#22c55e';
    const msg = t.win.replace('{n}',secret).replace('{t}',tries);
    const hint = document.getElementById('hintMsg');
    hint.textContent = msg;
    hint.className = 'guess-hint win';
    document.getElementById('inputRow').style.display = 'none';
    gameOver = true;
    onWin(tries);
  } else if(g > secret){
    span.className='high'; hist.prepend(span);
    const hint=document.getElementById('hintMsg');
    hint.textContent=t.high; hint.className='guess-hint high';
  } else {
    span.className='low'; hist.prepend(span);
    const hint=document.getElementById('hintMsg');
    hint.textContent=t.low; hint.className='guess-hint low';
  }
  inp.value=''; inp.focus();
}

function onWin(score){
  if(qualifies(score)){
    pendingScore = score;
    const t = GT[currentLang]||GT.ar;
    document.getElementById('nameEntryMsg').textContent = t.lbNew;
    document.getElementById('nameInput').placeholder = t.lbPh;
    document.getElementById('saveBtn').textContent = t.lbSave;
    document.getElementById('nameEntry').style.display = '';
    setTimeout(()=>document.getElementById('nameInput').focus(), 100);
  }
}

function saveScore(){
  if(pendingScore===null) return;
  const name = document.getElementById('nameInput').value.trim();
  addEntry(name||'?', pendingScore);
  pendingScore = null;
  document.getElementById('nameEntry').style.display = 'none';
  document.getElementById('nameInput').value = '';
  renderLb();
}

function updateGameText(){
  const t = GT[currentLang]||GT.ar;
  document.getElementById('rangeLbl').textContent = t.range;
  document.getElementById('newGameBtn').textContent = t.new;
  document.getElementById('triesLbl').textContent = t.tries;
  document.getElementById('guessBtn').textContent = t.guess;
  document.getElementById('guessInput').placeholder = t.ph;
  document.getElementById('lbTitle').textContent = t.lbTitle;
  document.getElementById('clearBtn').textContent = t.lbClear;
  renderLb();
}

document.addEventListener('DOMContentLoaded', ()=>{
  const origSet = window.setLang;
  window.setLang = function(lang){
    origSet && origSet(lang);
    currentLang = lang;
    document.documentElement.dir = lang==='ar'?'rtl':'ltr';
    updateGameText();
    if(pendingScore!==null){
      const t=GT[lang]||GT.ar;
      document.getElementById('nameEntryMsg').textContent=t.lbNew;
      document.getElementById('nameInput').placeholder=t.lbPh;
      document.getElementById('saveBtn').textContent=t.lbSave;
    }
  };
  newGame();
});
</script>
<script src="i18n.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/my-tools-site/sw.js');</script>
</body></html>
