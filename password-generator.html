<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد كلمات المرور</title>
<meta name="description" content="ولّد كلمات مرور قوية وآمنة بضغطة واحدة، مع إمكانية تخصيص الطول والرموز والأرقام.">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #6dd5ed, #2193b0);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  h1 {
    font-size: 22px;
    text-align: center;
    color: #2193b0;
    margin-bottom: 24px;
  }
  .output {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #passwordOutput {
    flex: 1;
    padding: 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 17px;
    font-family: monospace;
    text-align: center;
    background: #f8f9fa;
    letter-spacing: 1px;
  }
  #copyBtn {
    padding: 0 16px;
    background: #f0f0f0;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
  }
  #copyBtn:hover { background: #e0e0e0; }
  .option-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 15px;
    color: #444;
  }
  input[type="range"] {
    width: 100%;
    margin-top: 8px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #ccc;
    border-radius: 24px;
    transition: 0.2s;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider { background: #2193b0; }
  input:checked + .slider:before { transform: translateX(-20px); }
  button.generate {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: #2193b0;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button.generate:hover { background: #1a7b94; }
  a.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #2193b0;
    text-decoration: none;
    font-size: 14px;
  }
  #copiedMsg {
    text-align: center;
    font-size: 13px;
    color: #28a745;
    height: 16px;
    margin-top: -12px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔑 مولد كلمات المرور</h1>

  <div class="output">
    <input type="text" id="passwordOutput" readonly>
    <button id="copyBtn" onclick="copyPassword()">📋</button>
  </div>
  <div id="copiedMsg"></div>

  <div class="option-row">
    <span>الطول: <b id="lengthLabel">14</b></span>
  </div>
  <input type="range" id="lengthSlider" min="6" max="32" value="14" oninput="onLengthChange()">

  <div class="option-row">
    <span>أرقام (0-9)</span>
    <label class="switch">
      <input type="checkbox" id="numbers" checked onchange="generatePassword()">
      <span class="slider"></span>
    </label>
  </div>

  <div class="option-row">
    <span>رموز (!@#$)</span>
    <label class="switch">
      <input type="checkbox" id="symbols" checked onchange="generatePassword()">
      <span class="slider"></span>
    </label>
  </div>

  <div class="option-row">
    <span>حروف كبيرة (A-Z)</span>
    <label class="switch">
      <input type="checkbox" id="uppercase" checked onchange="generatePassword()">
      <span class="slider"></span>
    </label>
  </div>

  <button class="generate" onclick="generatePassword()">🔄 توليد جديد</button>

  <a href="index.html" class="back">⬅ رجوع للصفحة الرئيسية</a>
</div>

<script>
function onLengthChange() {
  document.getElementById('lengthLabel').textContent = document.getElementById('lengthSlider').value;
  generatePassword();
}

function generatePassword() {
  const length = parseInt(document.getElementById('lengthSlider').value);
  const useNumbers = document.getElementById('numbers').checked;
  const useSymbols = document.getElementById('symbols').checked;
  const useUppercase = document.getElementById('uppercase').checked;

  const lower = 'abcdefghijklmnopqrstuvwxyz';
  const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const numbers = '0123456789';
  const symbols = '!@#$%^&*()_-+=';

  let charset = lower;
  if (useUppercase) charset += upper;
  if (useNumbers) charset += numbers;
  if (useSymbols) charset += symbols;

  let password = '';
  const array = new Uint32Array(length);
  crypto.getRandomValues(array);
  for (let i = 0; i < length; i++) {
    password += charset[array[i] % charset.length];
  }

  document.getElementById('passwordOutput').value = password;
  document.getElementById('copiedMsg').textContent = '';
}

function copyPassword() {
  const output = document.getElementById('passwordOutput');
  output.select();
  navigator.clipboard.writeText(output.value).then(() => {
    document.getElementById('copiedMsg').textContent = 'تم النسخ ✓';
    setTimeout(() => document.getElementById('copiedMsg').textContent = '', 1500);
  });
}

generatePassword();
</script>

</body>
</html>
