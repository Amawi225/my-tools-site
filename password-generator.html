<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد كلمات المرور — أدواتي</title>
<meta name="description" content="ولّد كلمات مرور قوية وآمنة بضغطة واحدة، مع إمكانية تخصيص الطول والرموز والأرقام.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-brand">أدواتي</a>
    <div class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="about.html">من نحن</a>
      <a href="contact.html">تواصل معنا</a>
    </div>
  </div>
</nav>

<main>
  <div class="tool-page">
    <div class="page-header">
      <a href="index.html">← العودة للرئيسية</a>
    </div>

    <div class="card">
      <div class="card-icon" style="background:#f8fafc;">🔑</div>
      <div class="card-title">مولد كلمات المرور</div>
      <div class="card-subtitle">كلمات مرور قوية وآمنة بضغطة واحدة</div>
      <div class="divider"></div>

      <div class="password-output">
        <input type="text" id="passwordOutput" readonly>
        <button class="copy-btn" onclick="copyPassword()" title="نسخ">📋</button>
      </div>
      <div class="copy-msg" id="copiedMsg"></div>

      <div class="switch-row">
        <span>الطول: <strong id="lengthLabel">14</strong></span>
      </div>
      <input type="range" id="lengthSlider" min="6" max="32" value="14" oninput="onLengthChange()" style="width:100%;margin:10px 0 4px;accent-color:var(--primary);">

      <div class="switch-row">
        <span>أرقام (0–9)</span>
        <label class="switch"><input type="checkbox" id="numbers" checked onchange="generatePassword()"><span class="slider"></span></label>
      </div>

      <div class="switch-row">
        <span>رموز (!@#$)</span>
        <label class="switch"><input type="checkbox" id="symbols" checked onchange="generatePassword()"><span class="slider"></span></label>
      </div>

      <div class="switch-row" style="border-bottom:none;">
        <span>حروف كبيرة (A–Z)</span>
        <label class="switch"><input type="checkbox" id="uppercase" checked onchange="generatePassword()"><span class="slider"></span></label>
      </div>

      <button class="btn btn-primary" onclick="generatePassword()">توليد كلمة مرور جديدة</button>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="about.html">من نحن</a>
    <a href="contact.html">تواصل معنا</a>
  </div>
  <div class="footer-copy">© 2026 أدواتي</div>
</footer>

<script>
function onLengthChange() {
  document.getElementById('lengthLabel').textContent = document.getElementById('lengthSlider').value;
  generatePassword();
}

function generatePassword() {
  const length = parseInt(document.getElementById('lengthSlider').value);
  const useNumbers = document.getElementById('numbers').checked;
  const useSymbols = document.getElementById('symbols').checked;
  const useUppercase = document.getElementById('uppercase').checked;

  let charset = 'abcdefghijklmnopqrstuvwxyz';
  if (useUppercase) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (useNumbers) charset += '0123456789';
  if (useSymbols) charset += '!@#$%^&*()_-+=';

  const array = new Uint32Array(length);
  crypto.getRandomValues(array);
  document.getElementById('passwordOutput').value = Array.from(array).map(n => charset[n % charset.length]).join('');
  document.getElementById('copiedMsg').textContent = '';
}

function copyPassword() {
  const val = document.getElementById('passwordOutput').value;
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => {
    document.getElementById('copiedMsg').textContent = 'تم النسخ ✓';
    setTimeout(() => document.getElementById('copiedMsg').textContent = '', 2000);
  });
}

generatePassword();
</script>

</body>
</html>
