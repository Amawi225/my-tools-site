<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد كلمات المرور القوية — مجاني واونلاين</title>
<meta name="description" content="ولّد كلمة مرور قوية وآمنة مجاناً اونلاين بضغطة واحدة.">
<meta name="robots" content="index, follow">
<link rel="stylesheet" href="style.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-97DQT5FHPF"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-97DQT5FHPF');</script>
</head>
<body>
<nav class="navbar"><div class="nav-container">
  <a href="index.html" class="nav-brand">أدواتي</a>
  <div class="nav-links">
    <a href="index.html" data-i18n="nav_home">الرئيسية</a>
    <a href="about.html" data-i18n="nav_about">من نحن</a>
    <a href="contact.html" data-i18n="nav_contact">تواصل معنا</a>
    <button class="signup-nav-btn" onclick="openSignup()" id="signupNavBtn" data-i18n="signup_btn">تسجيل</button>
    <div class="lang-switcher">
      <button class="lang-btn" onclick="toggleLangMenu()">🌐 <span id="currentLang">عر</span> ▾</button>
      <div class="lang-menu" id="langMenu">
        <a onclick="setLang('ar')">🇸🇦 العربية</a><a onclick="setLang('en')">🇬🇧 English</a>
        <a onclick="setLang('fr')">🇫🇷 Français</a><a onclick="setLang('es')">🇪🇸 Español</a>
        <a onclick="setLang('de')">🇩🇪 Deutsch</a><a onclick="setLang('ru')">🇷🇺 Русский</a>
      </div>
    </div>
  </div>
</div></nav>
<main><div class="tool-page">
  <div class="page-header"><a href="index.html" data-i18n="back">← العودة للرئيسية</a></div>
  <div class="card">
    <div class="card-icon" style="background:#f8fafc;">🔑</div>
    <div class="card-title" data-i18n="pass_title">مولد كلمات المرور</div>
    <div class="card-subtitle" data-i18n="pass_sub">كلمات مرور قوية وآمنة بضغطة واحدة</div>
    <div class="divider"></div>
    <label><span data-i18n="pass_length">الطول:</span> <span id="lenDisplay">16</span></label>
    <input type="range" id="lengthSlider" min="8" max="64" value="16" oninput="document.getElementById('lenDisplay').textContent=this.value;generatePassword()" style="width:100%;accent-color:var(--primary);margin:8px 0;">
    <div class="switch-row"><label data-i18n="pass_numbers">أرقام (0–9)</label><label class="toggle"><input type="checkbox" id="useNumbers" checked onchange="generatePassword()"><span class="slider"></span></label></div>
    <div class="switch-row"><label data-i18n="pass_symbols">رموز (!@#$)</label><label class="toggle"><input type="checkbox" id="useSymbols" checked onchange="generatePassword()"><span class="slider"></span></label></div>
    <div class="switch-row"><label data-i18n="pass_upper">الأحرف الكبيرة</label><label class="toggle"><input type="checkbox" id="useUpper" checked onchange="generatePassword()"><span class="slider"></span></label></div>
    <div class="pass-output-wrap" id="passWrap" onclick="copyPassword()" style="cursor:pointer;margin:16px 0 4px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center;gap:12px;">
      <span class="pass-output" id="passOutput" style="font-family:monospace;font-size:16px;word-break:break-all;"></span>
      <span style="font-size:18px;flex-shrink:0;">📋</span>
    </div>
    <div id="copyMsg" style="display:none;text-align:center;color:#16a34a;font-size:13px;font-weight:700;margin-bottom:8px;" data-i18n="pass_copied">تم النسخ ✓</div>
    <button class="btn btn-primary" onclick="generatePassword()" data-i18n="pass_btn">توليد كلمة مرور جديدة</button>
  </div>
</div></main>
<footer class="footer">
  <div class="footer-links"><a href="about.html" data-i18n="footer_about">من نحن</a><a href="contact.html" data-i18n="footer_contact">تواصل معنا</a></div>
  <div class="footer-copy" data-i18n="footer_copy">© 2026 أدواتي</div>
</footer>
<script>
function generatePassword() {
  const len = parseInt(document.getElementById('lengthSlider').value);
  const nums = document.getElementById('useNumbers').checked;
  const syms = document.getElementById('useSymbols').checked;
  const upper = document.getElementById('useUpper').checked;
  let chars = 'abcdefghijklmnopqrstuvwxyz';
  if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (nums) chars += '0123456789';
  if (syms) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
  if (!chars) chars = 'abcdefghijklmnopqrstuvwxyz';
  let pass = '';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  for (let i = 0; i < len; i++) pass += chars[arr[i] % chars.length];
  document.getElementById('passOutput').textContent = pass;
  document.getElementById('copyMsg').style.display = 'none';
}
function copyPassword() {
  const t = document.getElementById('passOutput').textContent;
  if (!t) return;
  navigator.clipboard.writeText(t).then(() => {
    const m = document.getElementById('copyMsg');
    m.style.display = 'block';
    setTimeout(() => m.style.display = 'none', 1800);
  });
}
generatePassword();
</script>
<script src="i18n.js"></script>
</body></html>
