<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عداد الكلمات والأحرف — أدواتي</title>
<meta name="description" content="عداد كلمات وأحرف فوري لمقالاتك ونصوصك">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-brand">أدواتي</a>
    <div class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="about.html">من نحن</a>
      <a href="contact.html">تواصل معنا</a>
    </div>
  </div>
</nav>

<main>
  <div class="tool-page" style="max-width:560px;">
    <div class="page-header">
      <a href="index.html">← العودة للرئيسية</a>
    </div>

    <div class="card">
      <div class="card-icon" style="background:#fefce8;">🔤</div>
      <div class="card-title">عداد الكلمات والأحرف</div>
      <div class="card-subtitle">عداد فوري لمقالاتك ونصوصك</div>
      <div class="divider"></div>

      <textarea id="textInput" placeholder="اكتب أو الصق نصك هنا..." oninput="updateStats()" style="min-height:160px;"></textarea>

      <div class="stat-grid" style="margin-top:16px;">
        <div class="stat-box"><div class="stat-val" id="wordCount">0</div><div class="stat-lbl">كلمة</div></div>
        <div class="stat-box"><div class="stat-val" id="charCount">0</div><div class="stat-lbl">حرف</div></div>
        <div class="stat-box"><div class="stat-val" id="charNoSpace">0</div><div class="stat-lbl">بدون مسافات</div></div>
        <div class="stat-box"><div class="stat-val" id="sentenceCount">0</div><div class="stat-lbl">جملة</div></div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="about.html">من نحن</a>
    <a href="contact.html">تواصل معنا</a>
  </div>
  <div class="footer-copy">© 2026 أدواتي</div>
</footer>

<script>
function updateStats() {
  const text = document.getElementById('textInput').value;
  document.getElementById('wordCount').textContent = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
  document.getElementById('charCount').textContent = text.length;
  document.getElementById('charNoSpace').textContent = text.replace(/\s/g, '').length;
  document.getElementById('sentenceCount').textContent = text.trim() === '' ? 0 : text.split(/[.!?؟]+/).filter(s => s.trim().length > 0).length;
}
</script>

</body>
</html>
