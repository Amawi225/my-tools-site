<script>
function updateStats() {
  const text = document.getElementById('textInput').value;
  document.getElementById('wordCount').textContent = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
  document.getElementById('charCount').textContent = text.length;
  document.getElementById('charNoSpace').textContent = text.replace(/\s/g, '').length;
  document.getElementById('sentenceCount').textContent = text.trim() === '' ? 0 : text.split(/[.!?؟]+/).filter(s => s.trim().length > 0).length;
}
</script>
