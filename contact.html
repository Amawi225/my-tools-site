<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا — أدواتي</title>
<meta name="description" content="تواصل مع فريق أدواتي لأي استفسار أو اقتراح أو مشكلة تقنية.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-brand">أدواتي</a>
    <div class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="about.html">من نحن</a>
      <a href="contact.html" class="active">تواصل معنا</a>
    </div>
  </div>
</nav>

<main>
  <div class="tool-page">
    <div class="page-header">
      <a href="index.html">← العودة للرئيسية</a>
    </div>

    <div class="card">
      <div class="card-icon" style="background:#eff6ff;">📩</div>
      <div class="card-title">تواصل معنا</div>
      <div class="card-subtitle">عندك اقتراح لأداة جديدة أو واجهت مشكلة؟ راسلنا</div>
      <div class="divider"></div>

      <label for="name">الاسم</label>
      <input type="text" id="name" placeholder="اسمك">

      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="example@email.com" dir="ltr">

      <label for="message">رسالتك</label>
      <textarea id="message" placeholder="اكتب رسالتك هنا..." style="min-height:110px;"></textarea>

      <button class="btn btn-primary" onclick="sendMessage()">إرسال الرسالة</button>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="about.html">من نحن</a>
    <a href="contact.html">تواصل معنا</a>
  </div>
  <div class="footer-copy">© 2026 أدواتي</div>
</footer>

<script>
function sendMessage() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('message').value.trim();

  if (!name || !email || !message) { alert('الرجاء تعبئة جميع الحقول'); return; }

  const mailto = `mailto:ahmed.amawi@outlook.com?subject=${encodeURIComponent('رسالة من ' + name)}&body=${encodeURIComponent(message + '\n\nمن: ' + name + '\nالبريد: ' + email)}`;
  window.location.href = mailto;
}
</script>

</body>
</html>
