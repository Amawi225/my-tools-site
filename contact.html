<body>
<nav class="navbar"><div class="nav-container">
  <a href="index.html" class="nav-brand">أدواتي</a>
  <div class="nav-links">
    <a href="index.html" data-i18n="nav_home">الرئيسية</a>
    <a href="about.html" data-i18n="nav_about">من نحن</a>
    <a href="contact.html" class="active" data-i18n="nav_contact">تواصل معنا</a>
    
    <div class="lang-switcher">
      <button class="lang-btn" onclick="toggleLangMenu()">🌐 <span id="currentLang">عر</span> ▾</button>
      <div class="lang-menu" id="langMenu">
        <a onclick="setLang('ar')">🇸🇦 العربية</a><a onclick="setLang('en')">🇬🇧 English</a>
        <a onclick="setLang('fr')">🇫🇷 Français</a><a onclick="setLang('es')">🇪🇸 Español</a>
        <a onclick="setLang('de')">🇩🇪 Deutsch</a><a onclick="setLang('ru')">🇷🇺 Русский</a>
      </div>
    </div>
  </div>
</div></nav>
<main><div class="tool-page">
  <div class="page-header"><a href="index.html" data-i18n="back">← العودة للرئيسية</a></div>
  <div class="card">
    <div class="card-icon" style="background:#eff6ff;">📩</div>
    <div class="card-title" data-i18n="contact_title">تواصل معنا</div>
    <div class="card-subtitle" data-i18n="contact_sub">عندك اقتراح لأداة جديدة أو واجهت مشكلة؟ راسلنا</div>
    <div class="divider"></div>
    <label for="name" data-i18n="contact_name">الاسم</label>
    <input type="text" id="name" data-i18n-ph="contact_name" placeholder="اسمك">
    <label for="email" data-i18n="contact_email">البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@email.com" dir="ltr">
    <label for="message" data-i18n="contact_msg">رسالتك</label>
    <textarea id="message" data-i18n-ph="contact_msg" placeholder="اكتب رسالتك هنا..." style="min-height:110px;"></textarea>
    <button class="btn btn-primary" onclick="sendMessage()" data-i18n="contact_btn">إرسال الرسالة</button>
  </div>
</div></main>
<footer class="footer">
  <div class="footer-links"><a href="about.html" data-i18n="footer_about">من نحن</a><a href="contact.html" data-i18n="footer_contact">تواصل معنا</a></div>
  <div class="footer-copy" data-i18n="footer_copy">© 2026 أدواتي</div>
</footer>
<script>
function sendMessage() {
  const lang = localStorage.getItem('lang') || 'en';
  const t = T[lang];
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('message').value.trim();
  if (!name || !email || !message) { showToast(t.contact_error, 'error'); return; }
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  if (!emailRe.test(email)) { showToast(t.contact_email_invalid || 'Invalid email', 'error'); return; }
  const mailto = `mailto:ahmed.amawi@outlook.com?subject=${encodeURIComponent('Message from ' + name)}&body=${encodeURIComponent(message + '\n\nFrom: ' + name + '\nEmail: ' + email)}`;
  window.location.href = mailto;
}
</script>
<script src="i18n.js?v=27"></script>
</body></html>
