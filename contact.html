<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا - أدواتي</title>
<meta name="description" content="تواصل مع فريق أدواتي لأي استفسار أو اقتراح أو مشكلة تقنية.">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #6dd5ed, #2193b0);
    min-height: 100vh; margin: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 32px 24px;
    max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  h1 { font-size: 22px; text-align: center; color: #2193b0; margin-bottom: 8px; }
  p.sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 22px; }
  label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; margin-top: 14px; }
  input, textarea {
    width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; font-family: inherit;
  }
  textarea { min-height: 100px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: #2193b0; }
  button {
    width: 100%; margin-top: 20px; padding: 14px; background: #2193b0; color: #fff;
    border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  button:hover { background: #1a7b94; }
  a.back { display: block; text-align: center; margin-top: 20px; color: #2193b0; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>

<div class="card">
  <h1>📩 تواصل معنا</h1>
  <p class="sub">عندك اقتراح لأداة جديدة أو واجهت مشكلة؟ راسلنا</p>

  <label for="name">الاسم</label>
  <input type="text" id="name" placeholder="اسمك">

  <label for="email">البريد الإلكتروني</label>
  <input type="email" id="email" placeholder="example@email.com">

  <label for="message">رسالتك</label>
  <textarea id="message" placeholder="اكتب رسالتك هنا..."></textarea>

  <button onclick="sendMessage()">إرسال</button>

  <a href="index.html" class="back">⬅ رجوع للصفحة الرئيسية</a>
</div>

<script>
function sendMessage() {
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const message = document.getElementById('message').value;

  if (!name || !email || !message) {
    alert('الرجاء تعبئة كل الحقول');
    return;
  }

  // ⚠️ استبدل هذا البريد ببريدك الفعلي، أو اربطه بخدمة مثل Formspree
  const mailto = `mailto:youremail@example.com?subject=رسالة من ${encodeURIComponent(name)}&body=${encodeURIComponent(message + '\n\nمن: ' + email)}`;
  window.location.href = mailto;
}
</script>

</body>
</html>
