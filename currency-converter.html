<main><div class="tool-page">
  <div class="page-header"><a href="index.html" data-i18n="back">← العودة للرئيسية</a></div>
  <div class="card">
    <div class="card-icon" style="background:#fefce8;">💱</div>

    <div class="card-subtitle" data-i18n="currency_sub">أسعار صرف حية من الإنترنت</div>
    <div class="divider"></div>
    <label data-i18n="currency_amount">المبلغ</label>
    <input type="number" id="amount" value="1" oninput="convert()">
    <div class="row">

        <button onclick="swapCurrencies()" style="width:44px;height:44px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;" title="swap">⇄</button>

    </div>

<script>
const CURRENCIES = {
  USD:'🇺🇸 USD',EUR:'🇪🇺 EUR',GBP:'🇬🇧 GBP',SAR:'🇸🇦 SAR',AED:'🇦🇪 AED',
  KWD:'🇰🇼 KWD',QAR:'🇶🇦 QAR',BHD:'🇧🇭 BHD',OMR:'🇴🇲 OMR',EGP:'🇪🇬 EGP',
  JOD:'🇯🇴 JOD',TRY:'🇹🇷 TRY',INR:'🇮🇳 INR',PKR:'🇵🇰 PKR',BDT:'🇧🇩 BDT',
  MYR:'🇲🇾 MYR',IDR:'🇮🇩 IDR',THB:'🇹🇭 THB',JPY:'🇯🇵 JPY',CNY:'🇨🇳 CNY',
  KRW:'🇰🇷 KRW',CAD:'🇨🇦 CAD',AUD:'🇦🇺 AUD',CHF:'🇨🇭 CHF',SEK:'🇸🇪 SEK',
  NOK:'🇳🇴 NOK',DKK:'🇩🇰 DKK',PLN:'🇵🇱 PLN',RUB:'🇷🇺 RUB',BRL:'🇧🇷 BRL',
  MXN:'🇲🇽 MXN',ZAR:'🇿🇦 ZAR'
};
let rates = null;
const RATES_CACHE_KEY = 'adawati_rates_v2';
const RATES_CACHE_TTL = 4 * 60 * 60 * 1000; // 4 hours

function loadCachedRates() {
  try {
    const c = JSON.parse(localStorage.getItem(RATES_CACHE_KEY));
    if (c && c.r && c.ts && (Date.now() - c.ts < RATES_CACHE_TTL)) return c;
  } catch(e) {}
  return null;
}
function saveCache(r) {
  try { localStorage.setItem(RATES_CACHE_KEY, JSON.stringify({r, ts: Date.now()})); } catch(e) {}
}
function setStatus(msg) {
  const el = document.getElementById('rateStatus');
  if (el) el.textContent = msg;
}

function populateSelects() {
  const from = document.getElementById('fromCurr');
  const to = document.getElementById('toCurr');
  let fromHTML = '', toHTML = '';
  Object.entries(CURRENCIES).forEach(([code, label]) => {
    fromHTML += `<option value="${code}" ${code==='USD'?'selected':''}>${label}</option>`;
    toHTML   += `<option value="${code}" ${code==='SAR'?'selected':''}>${label}</option>`;
  });
  from.innerHTML = fromHTML;
  to.innerHTML   = toHTML;
}

const FALLBACK_RATES = {
  USD:1,EUR:0.92,GBP:0.79,SAR:3.75,AED:3.67,KWD:0.307,QAR:3.64,BHD:0.377,
  OMR:0.385,EGP:48.5,JOD:0.71,TRY:32.1,INR:83.2,PKR:278,BDT:110,MYR:4.7,
  IDR:15700,THB:35.6,JPY:149,CNY:7.24,KRW:1320,CAD:1.36,AUD:1.53,CHF:0.89,
  SEK:10.4,NOK:10.6,DKK:6.88,PLN:4.0,RUB:90,BRL:4.96,MXN:17.1,ZAR:18.7
};

async function tryFetch(url, parseRates) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 5000);
  try {
    const res = await fetch(url, {signal: ctrl.signal});
    clearTimeout(t);
    const data = await res.json();
    const r = parseRates(data);
    if (r && r.EUR) { r.USD = r.USD || 1; return r; }
    return null;
  } catch(e) { clearTimeout(t); return null; }
}

async function fetchRates() {
  // 1. Use cache immediately if fresh
  const cached = loadCachedRates();
  if (cached) {
    rates = cached.r;
    const mins = Math.round((Date.now() - cached.ts) / 60000);
    setStatus(mins < 60 ? `✅ أسعار محدّثة (منذ ${mins} دقيقة)` : `✅ آخر تحديث: ${Math.round(mins/60)} ساعة`);
    convert();
    // Refresh in background without blocking UI
    tryLiveFetch();
    return;
  }
  // 2. No cache — fetch live
  document.getElementById('loading').style.display = 'block';
  const ok = await tryLiveFetch();
  document.getElementById('loading').style.display = 'none';
  if (!ok) {
    // 3. All APIs failed — use static fallback silently
    rates = FALLBACK_RATES;
    setStatus('⚠️ أسعار تقريبية (لا يوجد اتصال) — يمكن استخدام الأداة');
    convert();
  }
}

async function tryLiveFetch() {
  const attempts = [
    () => tryFetch('https://open.er-api.com/v6/latest/USD', d => d.rates),
    () => tryFetch('https://api.frankfurter.app/latest?from=USD', d => Object.assign({USD:1}, d.rates)),
    () => tryFetch('https://api.exchangerate-api.com/v4/latest/USD', d => d.rates),
  ];
  for (const attempt of attempts) {
    const r = await attempt();
    if (r) {
      rates = r;
      saveCache(r);
      setStatus('✅ أسعار حية محدّثة الآن');
      document.getElementById('loading').style.display = 'none';
      convert();
      return true;
    }
  }
  return false;
}

function convert() {
  if (!rates) return;
  const amount = parseFloat(document.getElementById('amount').value) || 0;
  const from = document.getElementById('fromCurr').value;
  const to = document.getElementById('toCurr').value;
  const fromRate = rates[from] || 1;
  const toRate = rates[to] || 1;
  const result = (amount / fromRate) * toRate;
  document.getElementById('resultVal').textContent = result.toFixed(4).replace(/\.?0+$/, '') + ' ' + to;
  const rate1 = (1 / fromRate) * toRate;
  document.getElementById('rateLabel').textContent = `1 ${from} = ${rate1.toFixed(4)} ${to}`;
  document.getElementById('result').classList.add('show');
}

function swapCurrencies() {
  const f = document.getElementById('fromCurr'), t = document.getElementById('toCurr');
  const tmp = f.value; f.value = t.value; t.value = tmp;
  convert();
}

populateSelects();
fetchRates();
</script>
