<meta name="keywords" content="حاسبة العمر, كم عمري, حساب العمر بالأيام, كم تبقى على عيد ميلادي, age calculator">
<meta name="robots" content="index, follow">
<meta property="og:title" content="حاسبة العمر — أدواتي">

<meta property="og:type" content="website">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-brand">أدواتي</a>
    <div class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="about.html">من نحن</a>
      <a href="contact.html">تواصل معنا</a>
    </div>
  </div>
</nav>

<main>
  <div class="tool-page">
    <div class="page-header">
      <a href="index.html">← العودة للرئيسية</a>
    </div>

    <div class="card">
      <div class="card-icon" style="background:#fff7ed;">📅</div>
      <div class="card-title">حاسبة العمر</div>
      <div class="card-subtitle">عمرك بالتفصيل — سنوات وأشهر وأيام</div>
      <div class="divider"></div>

      <label for="birthdate">تاريخ ميلادك</label>
      <input type="date" id="birthdate">

      <button class="btn btn-primary" onclick="calcAge()">احسب عمري</button>

      <div id="result" style="display:none; margin-top:20px;">
        <div class="stat-grid">
          <div class="stat-box"><div class="stat-val" id="years"></div><div class="stat-lbl">سنة</div></div>
          <div class="stat-box"><div class="stat-val" id="months"></div><div class="stat-lbl">شهر</div></div>
          <div class="stat-box"><div class="stat-val" id="days"></div><div class="stat-lbl">يوم</div></div>
        </div>
        <div class="stat-grid" style="margin-top:10px;">
          <div class="stat-box">
            <div class="stat-val" id="totalDays" style="font-size:17px;"></div>
            <div class="stat-lbl">إجمالي الأيام</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="daysToNext" style="font-size:17px;"></div>
            <div class="stat-lbl">يوم حتى عيد ميلادك</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

</footer>

<script>
function calcAge() {
  const birthInput = document.getElementById('birthdate').value;
  if (!birthInput) { alert('اختر تاريخ ميلادك'); return; }

  const birth = new Date(birthInput);
  const today = new Date();

  let years = today.getFullYear() - birth.getFullYear();
  let months = today.getMonth() - birth.getMonth();
  let days = today.getDate() - birth.getDate();

  if (days < 0) {
    months--;
    days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
  }
  if (months < 0) { years--; months += 12; }

  const totalDays = Math.floor((today - birth) / 86400000);

  let next = new Date(today.getFullYear(), birth.getMonth(), birth.getDate());
  if (next <= today) next.setFullYear(today.getFullYear() + 1);
  const daysToNext = Math.ceil((next - today) / 86400000);

  document.getElementById('years').textContent = years;
  document.getElementById('months').textContent = months;
  document.getElementById('days').textContent = days;
  document.getElementById('totalDays').textContent = totalDays.toLocaleString();
  document.getElementById('daysToNext').textContent = daysToNext;
  document.getElementById('result').style.display = 'block';
}
</script>

</body>
