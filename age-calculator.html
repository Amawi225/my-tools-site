<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة العمر</title>
<meta name="description" content="احسب عمرك بالتفصيل بالسنوات والشهور والأيام">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #6dd5ed, #2193b0);
    min-height: 100vh; margin: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 32px 24px;
    max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  h1 { font-size: 22px; text-align: center; color: #2193b0; margin-bottom: 24px; }
  label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;
  }
  input:focus { outline: none; border-color: #2193b0; }
  button.calc {
    width: 100%; margin-top: 22px; padding: 14px; background: #2193b0; color: #fff;
    border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  button.calc:hover { background: #1a7b94; }
  #result { margin-top: 24px; display: none; }
  #result.show { display: block; }
  .stat-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .stat-box {
    flex: 1; background: #f8f9fa; border-radius: 10px; padding: 14px 6px; text-align: center;
  }
  .stat-box .big { font-size: 22px; font-weight: bold; color: #2193b0; }
  .stat-box .label { font-size: 11px; color: #777; margin-top: 2px; }
  .extra {
    background: #f8f9fa; border-radius: 10px; padding: 14px; text-align: center; margin-top: 8px; font-size: 14px; color: #555;
  }
  a.back { display: block; text-align: center; margin-top: 20px; color: #2193b0; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>

<div class="card">
  <h1>📅 حاسبة العمر</h1>

  <label for="birthdate">تاريخ ميلادك</label>
  <input type="date" id="birthdate">

  <button class="calc" onclick="calcAge()">احسب عمري</button>

  <div id="result">
    <div class="stat-row">
      <div class="stat-box"><div class="big" id="years"></div><div class="label">سنة</div></div>
      <div class="stat-box"><div class="big" id="months"></div><div class="label">شهر</div></div>
      <div class="stat-box"><div class="big" id="days"></div><div class="label">يوم</div></div>
    </div>
    <div class="extra">📆 إجمالي الأيام: <b id="totalDays"></b></div>
    <div class="extra">🎂 عدد الأيام حتى عيد ميلادك القادم: <b id="daysToNext"></b></div>
  </div>

  <a href="index.html" class="back">⬅ رجوع للصفحة الرئيسية</a>
</div>

<script>
function calcAge() {
  const birthInput = document.getElementById('birthdate').value;
  if (!birthInput) { alert('اختار تاريخ ميلادك'); return; }

  const birth = new Date(birthInput);
  const today = new Date();

  let years = today.getFullYear() - birth.getFullYear();
  let months = today.getMonth() - birth.getMonth();
  let days = today.getDate() - birth.getDate();

  if (days < 0) {
    months--;
    const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
    days += lastMonth.getDate();
  }
  if (months < 0) {
    years--;
    months += 12;
  }

  const totalDays = Math.floor((today - birth) / (1000 * 60 * 60 * 24));

  let nextBirthday = new Date(today.getFullYear(), birth.getMonth(), birth.getDate());
  if (nextBirthday < today) {
    nextBirthday.setFullYear(today.getFullYear() + 1);
  }
  const daysToNext = Math.ceil((nextBirthday - today) / (1000 * 60 * 60 * 24));

  document.getElementById('years').textContent = years;
  document.getElementById('months').textContent = months;
  document.getElementById('days').textContent = days;
  document.getElementById('totalDays').textContent = totalDays.toLocaleString();
  document.getElementById('daysToNext').textContent = daysToNext;

  document.getElementById('result').classList.add('show');
}
</script>

</body>
</html>
