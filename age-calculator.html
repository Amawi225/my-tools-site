<script>
function calcAge() {
  const lang = localStorage.getItem('lang') || 'ar';
  const birthInput = document.getElementById('birthdate').value;
  if (!birthInput) { showToast(T[lang].age_alert, 'error'); return; }
  const birth = new Date(birthInput), today = new Date();
  let y = today.getFullYear()-birth.getFullYear(), m = today.getMonth()-birth.getMonth(), d = today.getDate()-birth.getDate();
  if (d < 0) { m--; d += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const totalDays = Math.floor((today-birth)/86400000);
  let next = new Date(today.getFullYear(), birth.getMonth(), birth.getDate());
  if (next <= today) next.setFullYear(today.getFullYear()+1);
  document.getElementById('years').textContent = y;
  document.getElementById('months').textContent = m;
  document.getElementById('days').textContent = d;
  document.getElementById('totalDays').textContent = totalDays.toLocaleString();
  document.getElementById('daysToNext').textContent = Math.ceil((next-today)/86400000);
  document.getElementById('result').style.display = 'block';
}
</script>
