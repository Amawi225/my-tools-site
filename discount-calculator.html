<body>

<main><div class="tool-page">
  <div class="page-header"><a href="index.html" data-i18n="back">← العودة للرئيسية</a></div>
  <div class="card">
    <div class="card-icon" style="background:#fef2f2;">💯</div>
    <div class="card-title" data-i18n="discount_title">حاسبة نسبة وخصم</div>
    <div class="card-subtitle" data-i18n="discount_sub">احسب النسب المئوية والخصومات بسرعة</div>
    <div class="divider"></div>
    <div class="tabs">
      <div class="tab active" data-tab="percent" onclick="switchTab('percent')" data-i18n="tab_percent">نسبة مئوية</div>
      <div class="tab" data-tab="discount" onclick="switchTab('discount')" data-i18n="tab_discount">خصم</div>
    </div>
    <div class="section active" id="section-percent">
      <label for="p1" data-i18n="percent_label1">ما هي</label>
      <input type="number" id="p1" placeholder="25" oninput="calcPercent()">
      <label for="p2" data-i18n="percent_label2">% من الرقم</label>
      <input type="number" id="p2" placeholder="200" oninput="calcPercent()">
      <div id="result1" class="result-box success"><div class="result-value" id="percentResult"></div></div>
    </div>
    <div class="section" id="section-discount">
      <label for="d1" data-i18n="discount_label1">السعر الأصلي</label>
      <input type="number" id="d1" placeholder="100" oninput="calcDiscount()">
      <label for="d2" data-i18n="discount_label2">نسبة الخصم %</label>
      <input type="number" id="d2" placeholder="20" oninput="calcDiscount()">
      <div id="result2" class="result-box success"><div class="result-value" id="discountResult"></div><div class="result-label" id="discountSub"></div></div>
    </div>
  </div>
</div></main>
<footer class="footer">

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(`section-${tab}`).classList.add('active');
}
function calcPercent() {
  const p1=parseFloat(document.getElementById('p1').value), p2=parseFloat(document.getElementById('p2').value);
  const box=document.getElementById('result1');
  if(isNaN(p1)||isNaN(p2)){box.classList.remove('show');return;}
  document.getElementById('percentResult').textContent=`${p1}% = ${+(p1/100*p2).toFixed(4)}`;
  box.classList.add('show');
}
function calcDiscount() {
  const price=parseFloat(document.getElementById('d1').value), disc=parseFloat(document.getElementById('d2').value);
  const box=document.getElementById('result2');
  if(isNaN(price)||isNaN(disc)){box.classList.remove('show');return;}
  const saved=(disc/100)*price, final=price-saved;
  document.getElementById('discountResult').textContent=final.toFixed(2).replace(/\.?0+$/,'');
  document.getElementById('discountSub').textContent=`- ${saved.toFixed(2).replace(/\.?0+$/,'')}`;
  box.classList.add('show');
}
</script>
