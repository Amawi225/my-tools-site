<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة نسبة وخصم — أدواتي</title>
<meta name="description" content="احسب نسبة الخصم أو الزيادة على أي سعر بسهولة وسرعة، وعرف السعر النهائي بعد الخصم.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-brand">أدواتي</a>
    <div class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="about.html">من نحن</a>
      <a href="contact.html">تواصل معنا</a>
    </div>
  </div>
</nav>

<main>
  <div class="tool-page">
    <div class="page-header">
      <a href="index.html">← العودة للرئيسية</a>
    </div>

    <div class="card">
      <div class="card-icon" style="background:#fef2f2;">💯</div>
      <div class="card-title">حاسبة نسبة وخصم</div>
      <div class="card-subtitle">احسب النسب المئوية والخصومات بسرعة</div>
      <div class="divider"></div>

      <div class="tabs">
        <div class="tab active" data-tab="percent" onclick="switchTab('percent')">نسبة مئوية</div>
        <div class="tab" data-tab="discount" onclick="switchTab('discount')">خصم</div>
      </div>

      <div class="section active" id="section-percent">
        <label for="p1">ما هي</label>
        <input type="number" id="p1" placeholder="مثال: 25" oninput="calcPercent()">
        <label for="p2">% من الرقم</label>
        <input type="number" id="p2" placeholder="مثال: 200" oninput="calcPercent()">
        <div id="result1" class="result-box success">
          <div class="result-value" id="percentResult"></div>
        </div>
      </div>

      <div class="section" id="section-discount">
        <label for="d1">السعر الأصلي</label>
        <input type="number" id="d1" placeholder="مثال: 100" oninput="calcDiscount()">
        <label for="d2">نسبة الخصم %</label>
        <input type="number" id="d2" placeholder="مثال: 20" oninput="calcDiscount()">
        <div id="result2" class="result-box success">
          <div class="result-value" id="discountResult"></div>
          <div class="result-label" id="discountSub"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="about.html">من نحن</a>
    <a href="contact.html">تواصل معنا</a>
  </div>
  <div class="footer-copy">© 2026 أدواتي</div>
</footer>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(`section-${tab}`).classList.add('active');
}

function calcPercent() {
  const p1 = parseFloat(document.getElementById('p1').value);
  const p2 = parseFloat(document.getElementById('p2').value);
  const box = document.getElementById('result1');
  if (isNaN(p1) || isNaN(p2)) { box.classList.remove('show'); return; }
  const result = (p1 / 100) * p2;
  document.getElementById('percentResult').textContent = `${p1}% من ${p2} = ${+result.toFixed(4)}`;
  box.classList.add('show');
}

function calcDiscount() {
  const price = parseFloat(document.getElementById('d1').value);
  const discount = parseFloat(document.getElementById('d2').value);
  const box = document.getElementById('result2');
  if (isNaN(price) || isNaN(discount)) { box.classList.remove('show'); return; }
  const saved = (discount / 100) * price;
  const finalPrice = price - saved;
  document.getElementById('discountResult').textContent = finalPrice.toFixed(2).replace(/\.?0+$/, '');
  document.getElementById('discountSub').textContent = `السعر بعد الخصم — وفّرت ${saved.toFixed(2).replace(/\.?0+$/, '')}`;
  box.classList.add('show');
}
</script>

</body>
</html>
