<meta name="description" content="Free random number generator for raffles, games and decisions. مولد أرقام عشوائية مجاناً اونلاين للقرعات والألعاب.">

</head>
<body>
<nav class="navbar"><div class="nav-container">
  <a href="index.html" class="nav-brand">أدواتي</a>
  <div class="nav-links">
    <a href="index.html" data-i18n="nav_home">الرئيسية</a>
    <a href="about.html" data-i18n="nav_about">من نحن</a>
    <a href="contact.html" data-i18n="nav_contact">تواصل معنا</a>
    <button class="signup-nav-btn" onclick="openSignup()" id="signupNavBtn" data-i18n="signup_btn">تسجيل</button>
    <div class="lang-switcher">
      <button class="lang-btn" onclick="toggleLangMenu()">🌐 <span id="currentLang">عر</span> ▾</button>
      <div class="lang-menu" id="langMenu">
        <a onclick="setLang('ar')">🇸🇦 العربية</a><a onclick="setLang('en')">🇬🇧 English</a>
        <a onclick="setLang('fr')">🇫🇷 Français</a><a onclick="setLang('es')">🇪🇸 Español</a>
        <a onclick="setLang('de')">🇩🇪 Deutsch</a><a onclick="setLang('ru')">🇷🇺 Русский</a>
      </div>
    </div>
  </div>
</div></nav>
<main><div class="tool-page">
  <div class="page-header"><a href="index.html" data-i18n="back">← العودة للرئيسية</a></div>
  <div class="card">
    <div class="card-icon" style="background:#fdf4ff;">🎲</div>
    <div class="card-title" data-i18n="rng_title">مولد أرقام عشوائية</div>
    <div class="card-subtitle" data-i18n="rng_sub">ولّد أرقاماً عشوائية للقرعات والألعاب</div>
    <div class="divider"></div>
    <div class="row">
      <div><label data-i18n="rng_min">أصغر رقم</label><input type="number" id="minVal" value="1" oninput="generate()"></div>
      <div><label data-i18n="rng_max">أكبر رقم</label><input type="number" id="maxVal" value="100" oninput="generate()"></div>
    </div>
    <label><span data-i18n="rng_count">عدد الأرقام:</span> <span id="countLabel">1</span></label>
    <input type="range" id="countSlider" min="1" max="20" value="1" oninput="document.getElementById('countLabel').textContent=this.value;generate()" style="width:100%;accent-color:var(--primary);margin:8px 0;">
    <div id="resultBox" style="margin-top:20px;padding:24px;background:linear-gradient(135deg,var(--primary-light),var(--accent-light));border-radius:var(--radius-lg);border:2px solid var(--border-focus);text-align:center;">
      <div id="numDisplay" style="font-size:56px;font-weight:900;color:var(--primary);letter-spacing:-2px;line-height:1;flex-wrap:wrap;display:flex;justify-content:center;gap:12px;align-items:center;"></div>
    </div>
    <button class="btn btn-primary" onclick="generate()" data-i18n="rng_btn">🎲 ولّد مرة أخرى</button>
    <div style="margin-top:12px;">
      <label data-i18n="rng_history">السجل</label>
      <div id="history" style="font-size:13px;color:var(--text-muted);max-height:80px;overflow-y:auto;padding:8px 12px;background:var(--surface-2);border-radius:var(--radius-sm);border:1px solid var(--border);"></div>
    </div>
  </div>
</div></main>
<footer class="footer" style="padding:28px;">
  <div style="max-width:1160px;margin:0 auto;">
    <div class="footer-links"><a href="about.html" data-i18n="footer_about">من نحن</a><a href="contact.html" data-i18n="footer_contact">تواصل معنا</a></div>
    <div class="footer-copy-simple" data-i18n="footer_copy">© 2026 أدواتي</div>
  </div>
</footer>
<script>
const history = [];
function generate() {
  const min = parseInt(document.getElementById('minVal').value) || 1;
  const max = parseInt(document.getElementById('maxVal').value) || 100;
  const count = parseInt(document.getElementById('countSlider').value) || 1;
  if (min >= max) return;
  const arr = new Uint32Array(count);
  crypto.getRandomValues(arr);
  const nums = Array.from(arr).map(n => min + (n % (max - min + 1)));
  document.getElementById('numDisplay').innerHTML = nums.map(n => `<span style="display:inline-block;min-width:60px;">${n}</span>`).join('');
  history.unshift(nums.join(', '));
  if (history.length > 10) history.pop();
  document.getElementById('history').innerHTML = history.map((h,i) => `<div style="padding:2px 0;border-bottom:${i<history.length-1?'1px solid var(--border)':'none'};">${h}</div>`).join('');
}
generate();
</script>
<script src="i18n.js?v=26"></script>
