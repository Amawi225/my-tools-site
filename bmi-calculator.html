<main><div class="tool-page">

    <div class="card-icon" style="background:#eff6ff;">⚖️</div>

    <label for="height" data-i18n="bmi_height">الطول (سنتيمتر)</label>
    <input type="number" id="height" data-i18n-ph="bmi_height" placeholder="مثال: 175" inputmode="decimal">

<script>
function calculateBMI() {
  const weight = parseFloat(document.getElementById('weight').value);
  const height = parseFloat(document.getElementById('height').value) / 100;
  const resultDiv = document.getElementById('result');
  const lang = localStorage.getItem('lang') || 'ar';
  const t = T[lang];
  if (!weight || !height || weight <= 0 || height <= 0) {
    resultDiv.className = 'result-box show danger';
    document.getElementById('bmiValue').textContent = '⚠️';
    document.getElementById('category').textContent = t.bmi_invalid;
    return;
  }
  const bmi = weight / (height * height);
  let category, cls;
  if (bmi < 18.5)    { category = t.bmi_underweight; cls = 'warning'; }
  else if (bmi < 25) { category = t.bmi_normal;      cls = 'success'; }
  else if (bmi < 30) { category = t.bmi_overweight;  cls = 'warning'; }
  else               { category = t.bmi_obese;       cls = 'danger';  }
  document.getElementById('bmiValue').textContent = bmi.toFixed(1);
  document.getElementById('category').textContent = category;
  resultDiv.className = `result-box show ${cls}`;
}
</script>
