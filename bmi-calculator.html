<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة مؤشر كتلة الجسم BMI</title>
<meta name="description" content="احسب مؤشر كتلة جسمك BMI مجاناً واعرف هل وزنك مثالي أم لا، مع تفسير النتيجة بالعربي.">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #6dd5ed, #2193b0);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  h1 {
    font-size: 22px;
    text-align: center;
    color: #2193b0;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 14px;
    color: #555;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #2193b0;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: #2193b0;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #1a7b94; }
  #result {
    margin-top: 24px;
    padding: 18px;
    border-radius: 10px;
    text-align: center;
    display: none;
  }
  #result.show { display: block; }
  #bmiValue {
    font-size: 32px;
    font-weight: bold;
    margin: 4px 0;
  }
  #category {
    font-size: 15px;
    font-weight: 600;
  }
  .underweight { background: #fff3cd; color: #856404; }
  .normal { background: #d4edda; color: #155724; }
  .overweight { background: #fff3cd; color: #856404; }
  .obese { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

<div class="card">
  <h1>⚖️ حاسبة مؤشر كتلة الجسم</h1>

  <label for="weight">الوزن (كغم)</label>
  <input type="number" id="weight" placeholder="مثال: 70" inputmode="decimal">

  <label for="height">الطول (سم)</label>
  <input type="number" id="height" placeholder="مثال: 175" inputmode="decimal">

  <button onclick="calculateBMI()">احسب</button>

  <div id="result">
    <div id="bmiValue"></div>
    <div id="category"></div>
  </div>
</div>

<script>
function calculateBMI() {
  const weight = parseFloat(document.getElementById('weight').value);
  const height = parseFloat(document.getElementById('height').value) / 100;
  const resultDiv = document.getElementById('result');

  if (!weight || !height || weight <= 0 || height <= 0) {
    resultDiv.className = 'show';
    resultDiv.style.background = '#f8d7da';
    resultDiv.style.color = '#721c24';
    document.getElementById('bmiValue').textContent = '⚠️';
    document.getElementById('category').textContent = 'الرجاء إدخال أرقام صحيحة';
    return;
  }

  const bmi = weight / (height * height);
  const bmiRounded = bmi.toFixed(1);

  let category, className;
  if (bmi < 18.5) {
    category = 'نقص في الوزن';
    className = 'underweight';
  } else if (bmi < 25) {
    category = 'وزن طبيعي';
    className = 'normal';
  } else if (bmi < 30) {
    category = 'زيادة في الوزن';
    className = 'overweight';
  } else {
    category = 'سمنة';
    className = 'obese';
  }

  document.getElementById('bmiValue').textContent = bmiRounded;
  document.getElementById('category').textContent = category;
  resultDiv.className = 'show ' + className;
}
</script>

</body>
</html>
