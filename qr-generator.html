<script>
function generateQR() {
  var btn    = document.getElementById('qrBtn');
  var status = document.getElementById('qrStatus');
  var wrap   = document.getElementById('qrWrap');
  var empty  = document.getElementById('qrEmpty');
  var display= document.getElementById('qrDisplay');
  var input  = document.getElementById('qrInput');
  var text   = input ? input.value.trim() : '';

  // Immediate visible proof the function ran
  if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }

  if (!text) {
    if (status) { status.textContent = '⚠️ اكتب نصاً أو رابطاً أولاً'; status.style.display = 'block'; }
    if (wrap)  wrap.style.display  = 'none';
    if (empty) empty.style.display = 'block';
    setTimeout(function(){ if(btn){btn.disabled=false;btn.textContent='توليد الرمز';} }, 1000);
    return;
  }

  if (status) { status.textContent = '⏳ جاري التوليد...'; status.style.display = 'block'; }
  if (wrap)  wrap.style.display  = 'none';
  if (empty) empty.style.display = 'none';

  var encoded = encodeURIComponent(text);
  var urls = [
    'https://chart.googleapis.com/chart?cht=qr&chs=220x220&chl=' + encoded + '&choe=UTF-8',
    'https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=10&data=' + encoded,
    'https://quickchart.io/qr?text=' + encoded + '&size=220'
  ];

  var tried = 0;
  function tryNext() {
    if (tried >= urls.length) {
      if (status) status.textContent = '❌ تعذّر التوليد. تحقق من اتصالك بالإنترنت.';
      if (btn) { btn.disabled = false; btn.textContent = 'توليد الرمز'; }
      return;
    }
    var img = new Image();
    img.onload = function() {
      img.id = 'qrImg';
      img.width = 220; img.height = 220;
      img.style.borderRadius = '4px';
      if (display) { display.innerHTML = ''; display.appendChild(img); }
      if (wrap) wrap.style.display = 'block';
      if (status) status.style.display = 'none';
      if (empty) empty.style.display = 'none';
      if (btn) { btn.disabled = false; btn.textContent = 'توليد الرمز'; }
    };
    img.onerror = function() { tried++; tryNext(); };
    img.src = urls[tried++];
  }
  tryNext();
}

function downloadQR() {
  var img = document.getElementById('qrImg');
  if (!img) return;
  var a = document.createElement('a');
  a.download = 'qr-code.png';
  a.href = img.src;
  a.target = '_blank';
  a.click();
}

document.addEventListener('DOMContentLoaded', function() {
  var btn = document.getElementById('qrBtn');
  if (btn) btn.addEventListener('click', generateQR);
  var inp = document.getElementById('qrInput');
  if (inp) inp.addEventListener('input', generateQR);
  if (inp) inp.addEventListener('paste', function(){ setTimeout(generateQR, 50); });
});
</script>
