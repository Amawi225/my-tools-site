<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-97DQT5FHPF"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-97DQT5FHPF');</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3337905412116301" crossorigin="anonymous"></script><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة الإكرامية — قسّم الفاتورة مجاناً</title>
<meta name="description" content="احسب الإكرامية وقسّم الفاتورة بين الأصدقاء مجاناً اونلاين.">
<meta name="robots" content="index, follow">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar"><div class="nav-container">
  <a href="index.html" class="nav-brand">أدواتي</a>
  <div class="nav-links">
    <a href="index.html" data-i18n="nav_home">الرئيسية</a>
    <a href="about.html" data-i18n="nav_about">من نحن</a>
    <a href="contact.html" data-i18n="nav_contact">تواصل معنا</a>
    <button class="signup-nav-btn" onclick="openSignup()" id="signupNavBtn" data-i18n="signup_btn">تسجيل</button>
    <div class="lang-switcher">
      <button class="lang-btn" onclick="toggleLangMenu()">🌐 <span id="currentLang">عر</span> ▾</button>
      <div class="lang-menu" id="langMenu">
        <a onclick="setLang('ar')">🇸🇦 العربية</a><a onclick="setLang('en')">🇬🇧 English</a>
        <a onclick="setLang('fr')">🇫🇷 Français</a><a onclick="setLang('es')">🇪🇸 Español</a>
        <a onclick="setLang('de')">🇩🇪 Deutsch</a><a onclick="setLang('ru')">🇷🇺 Русский</a>
      </div>
    </div>
  </div>
</div></nav>
<main><div class="tool-page">
  <div class="page-header"><a href="index.html" data-i18n="back">← العودة للرئيسية</a></div>
  <div class="card">
    <div class="card-icon" style="background:#fdf4ff;">🤝</div>
    <div class="card-title" data-i18n="tip_title">حاسبة الإكرامية</div>
    <div class="card-subtitle" data-i18n="tip_sub">احسب الإكرامية وقسّم الفاتورة بسهولة</div>
    <div class="divider"></div>
    <label data-i18n="tip_bill">إجمالي الفاتورة</label>
    <input type="number" id="bill" placeholder="0.00" oninput="calcTip()">
    <label><span data-i18n="tip_pct">نسبة الإكرامية:</span> <span id="tipPctLabel">15</span>%</label>
    <input type="range" id="tipSlider" min="0" max="30" value="15" oninput="document.getElementById('tipPctLabel').textContent=this.value;calcTip()" style="width:100%;accent-color:var(--primary);margin:8px 0 4px;">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:4px;"><span>0%</span><span>10%</span><span>15%</span><span>20%</span><span>30%</span></div>
    <label data-i18n="tip_people">عدد الأشخاص</label>
    <input type="number" id="people" value="1" min="1" oninput="calcTip()">
    <div id="results" style="display:none;margin-top:20px;">
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-val" id="tipAmt"></div><div class="stat-lbl" data-i18n="tip_amount">الإكرامية</div></div>
        <div class="stat-box"><div class="stat-val" id="totalAmt"></div><div class="stat-lbl" data-i18n="tip_total">الإجمالي</div></div>
      </div>
      <div class="result-box show success" style="margin-top:14px;">
        <div class="result-value" id="perPerson"></div>
        <div class="result-label" data-i18n="tip_per_person">للشخص الواحد</div>
      </div>
    </div>
  </div>
</div></main>
<footer class="footer" style="padding:28px;">
  <div style="max-width:1160px;margin:0 auto;">
    <div class="footer-links"><a href="about.html" data-i18n="footer_about">من نحن</a><a href="contact.html" data-i18n="footer_contact">تواصل معنا</a></div>
    <div class="footer-copy-simple" data-i18n="footer_copy">© 2026 أدواتي</div>
  </div>
</footer>
<script>
function calcTip() {
  const bill = parseFloat(document.getElementById('bill').value) || 0;
  const pct = parseFloat(document.getElementById('tipSlider').value) || 0;
  const people = Math.max(1, parseInt(document.getElementById('people').value) || 1);
  if (!bill) { document.getElementById('results').style.display = 'none'; return; }
  const tip = bill * pct / 100;
  const total = bill + tip;
  document.getElementById('tipAmt').textContent = tip.toFixed(2);
  document.getElementById('totalAmt').textContent = total.toFixed(2);
  document.getElementById('perPerson').textContent = (total / people).toFixed(2);
  document.getElementById('results').style.display = 'block';
}
</script>
<script src="i18n.js"></script>
</body></html>
