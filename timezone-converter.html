<script>
const ZONES = [
  {name:'Riyadh',tz:'Asia/Riyadh',flag:'🇸🇦'},{name:'Dubai',tz:'Asia/Dubai',flag:'🇦🇪'},
  {name:'Cairo',tz:'Africa/Cairo',flag:'🇪🇬'},{name:'London',tz:'Europe/London',flag:'🇬🇧'},
  {name:'New York',tz:'America/New_York',flag:'🇺🇸'},{name:'Los Angeles',tz:'America/Los_Angeles',flag:'🇺🇸'},
  {name:'Paris',tz:'Europe/Paris',flag:'🇫🇷'},{name:'Berlin',tz:'Europe/Berlin',flag:'🇩🇪'},
  {name:'Moscow',tz:'Europe/Moscow',flag:'🇷🇺'},{name:'Istanbul',tz:'Europe/Istanbul',flag:'🇹🇷'},
  {name:'Tokyo',tz:'Asia/Tokyo',flag:'🇯🇵'},{name:'Beijing',tz:'Asia/Shanghai',flag:'🇨🇳'},
  {name:'Mumbai',tz:'Asia/Kolkata',flag:'🇮🇳'},{name:'Singapore',tz:'Asia/Singapore',flag:'🇸🇬'},
  {name:'Sydney',tz:'Australia/Sydney',flag:'🇦🇺'},{name:'Toronto',tz:'America/Toronto',flag:'🇨🇦'},
  {name:'Madrid',tz:'Europe/Madrid',flag:'🇪🇸'},{name:'Amman',tz:'Asia/Amman',flag:'🇯🇴'},
  {name:'Kuwait',tz:'Asia/Kuwait',flag:'🇰🇼'},{name:'Doha',tz:'Asia/Qatar',flag:'🇶🇦'},
];

const WORLD_CLOCKS = ['Riyadh','Dubai','London','New York','Tokyo','Sydney'];

function buildClocks() {
  const grid = document.getElementById('clockGrid');
  WORLD_CLOCKS.forEach(city => {
    const z = ZONES.find(x=>x.name===city);
    if (!z) return;
    const div = document.createElement('div');
    div.id = 'clk_'+city.replaceAll(' ','_');
    div.style.cssText = 'background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:center;';
    div.innerHTML = `<div style="font-size:20px;margin-bottom:2px;">${z.flag}</div>
      <div style="font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;">${city}</div>
      <div class="clk-time" style="font-size:22px;font-weight:900;color:var(--primary);font-family:monospace;">--:--</div>`;
    grid.appendChild(div);
  });
}

function tickClocks() {
  const now = new Date();
  WORLD_CLOCKS.forEach(city => {
    const z = ZONES.find(x=>x.name===city);
    if (!z) return;
    const el = document.querySelector('#clk_'+city.replaceAll(' ','_')+' .clk-time');
    if (el) el.textContent = now.toLocaleTimeString('en-US', {timeZone:z.tz,hour:'2-digit',minute:'2-digit',hour12:false});
  });
}

function populateTzSelects() {
  const from = document.getElementById('tzFrom'), to = document.getElementById('tzTo');
  ZONES.forEach((z,i) => {
    from.innerHTML += `<option value="${z.tz}" ${i===0?'selected':''}>${z.flag} ${z.name}</option>`;
    to.innerHTML   += `<option value="${z.tz}" ${i===2?'selected':''}>${z.flag} ${z.name}</option>`;
  });
}

function convertTime() {
  const input = document.getElementById('inputTime').value;
  if (!input) { document.getElementById('tzResult').classList.remove('show'); return; }
  const from = document.getElementById('tzFrom').value;
  const to = document.getElementById('tzTo').value;
  const date = new Date(input);
  const toStr = date.toLocaleString('en-GB', { timeZone: to, weekday:'short', year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  document.getElementById('tzResultVal').textContent = date.toLocaleTimeString('en-US', {timeZone:to, hour:'2-digit', minute:'2-digit', hour12:true});
  document.getElementById('tzResultLabel').textContent = toStr;
  document.getElementById('tzResult').classList.add('show');
}

const now = new Date();
const pad = v => String(v).padStart(2,'0');
document.getElementById('inputTime').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;

buildClocks();
populateTzSelects();
tickClocks();
setInterval(tickClocks, 1000);
</script>
